<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员后台</title>
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div id="loginBox" class="login-box">
  <h2 style="text-align:center;color:#0f172a;margin-top:0;">管理员登录</h2>
  <p class="sub">请输入管理员账号与密码</p>
  <label class="field-label" for="username">管理员账号</label>
  <input id="username" placeholder="管理员账号" value="admin">
  <label class="field-label" for="password">管理员密码</label>
  <input id="password" type="password" placeholder="管理员密码">
  <button onclick="adminLogin()">登录</button>
  <p id="loginMsg" class="msg"></p>
  <p class="sub" style="margin-bottom:0;">没有账号？<a href="/register.html" style="color:#0284c7;text-decoration:none;">用动态口令注册</a></p>
</div>

<div id="adminBox" class="hidden">
  <div class="top-bar">
    <h2>管理员后台</h2>
    <button onclick="logout()" class="btn-quiet">退出</button>
  </div>
  <!-- 宽屏下这里是左侧导航栏，窄屏下就是一排可换行的页签（第五档）。
       role=tablist/tab + aria-current 让键盘与读屏也能用。 -->
  <div class="workspace">
    <nav class="tabs" id="adminNav" role="tablist" aria-label="后台功能">
      <button class="active" role="tab" aria-current="page" onclick="switchTab('pending', this)">待审核</button>
      <button role="tab" onclick="switchTab('approved', this)">已通过</button>
      <button role="tab" onclick="switchTab('rejected', this)">回收站</button>
      <button role="tab" onclick="switchTab('schedule', this)">排期</button>
      <button role="tab" onclick="switchTab('banned', this)">黑名单</button>
      <button role="tab" onclick="switchTab('settings', this)">系统设置</button>
    </nav>
    <div class="workspace-main">
      <div id="listBox" role="tabpanel"><p class="sub">加载中...</p></div>
    </div>
  </div>
</div>
