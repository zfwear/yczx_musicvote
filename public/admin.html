<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员后台 - 盐中之声</title>
<link rel="stylesheet" href="assets/css/liquid-glass.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<!-- 流体环境光斑 -->
<div class="liquid-mesh-layer" aria-hidden="true">
  <div class="liquid-orb liquid-orb-1"></div>
  <div class="liquid-orb liquid-orb-2"></div>
  <div class="liquid-orb liquid-orb-3"></div>
</div>

<div class="layout-container admin-container">
  <!-- 登录卡片 -->
  <div id="loginBox" class="glass-panel login-box admin-login-card">
    <div class="admin-login-header">
      <div class="admin-icon-bubble">🎛️</div>
      <h2>广播站后台管理</h2>
      <p class="sub">请输入管理员凭证进入工作台</p>
    </div>
    <div class="admin-login-form">
      <div class="form-group">
        <label class="field-label" for="username">管理员账号</label>
        <input id="username" class="input-liquid" placeholder="账号" value="admin">
      </div>
      <div class="form-group">
        <label class="field-label" for="password">管理员密码</label>
        <input id="password" class="input-liquid" type="password" placeholder="密码">
      </div>
      <button class="btn-liquid btn-primary btn-submit-admin" onclick="adminLogin()">登录管理系统</button>
      <p id="loginMsg" class="msg"></p>
      <p class="sub-footer">没有账号？<a href="/register.html">用动态口令注册</a></p>
    </div>
  </div>

  <!-- 工作台面板 -->
  <div id="adminBox" class="hidden">
    <header class="glass-panel admin-top-bar">
      <div class="admin-brand">
        <h2>盐中之声 · 广播站控制台</h2>
        <span class="badge-liquid badge-status">在线运维中</span>
      </div>
      <div class="admin-user-act">
        <a href="/" class="btn-liquid btn-secondary btn-sm" target="_blank">预览前台</a>
        <button onclick="logout()" class="btn-liquid btn-secondary btn-sm btn-logout">安全退出</button>
      </div>
    </header>

    <div class="workspace">
      <!-- 磨砂侧边导航 / 移动端顶置胶囊滑动条 -->
      <nav class="tabs glass-panel admin-sidebar" id="adminNav" role="tablist" aria-label="后台功能">
        <button class="tab-item active" role="tab" aria-current="page" onclick="switchTab('pending', this)">
          <span class="tab-icon">⏳</span> 待审核
        </button>
        <button class="tab-item" role="tab" onclick="switchTab('approved', this)">
          <span class="tab-icon">✅</span> 已通过
        </button>
        <button class="tab-item" role="tab" onclick="switchTab('rejected', this)">
          <span class="tab-icon">🗑️</span> 回收站
        </button>
        <button class="tab-item" role="tab" onclick="switchTab('schedule', this)">
          <span class="tab-icon">📅</span> 排期管理
        </button>
        <button class="tab-item" role="tab" onclick="switchTab('banned', this)">
          <span class="tab-icon">🚫</span> 黑名单
        </button>
        <button class="tab-item" role="tab" onclick="switchTab('settings', this)">
          <span class="tab-icon">⚙️</span> 系统设置
        </button>
      </nav>

      <!-- 核心工作区面板（纯局部刷新挂载点） -->
      <main class="workspace-main">
        <div id="listBox" class="glass-panel admin-content-panel" role="tabpanel">
          <p class="sub" style="text-align:center;padding:40px 0;">加载中...</p>
        </div>
      </main>
    </div>
  </div>

  <div id="beianFooter" class="beian-footer">
    <div>© <span id="beianYear">2026</span> <span id="beianHolder">盐中之声广播站</span> 版权所有 · 未经许可请勿转载或用于商业用途</div>
    <div class="beian-links">
      <a id="beianIcp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2026011040号</a>
      <span>|</span>
      <a id="beianGongan" href="https://beian.mps.gov.cn/#/query/webSearch?code=32090302000745" target="_blank" rel="noopener noreferrer">
        <img src="/assets/gongan-badge.png" alt="" width="14" height="15">
        <span id="beianGonganText">苏公网安备32090302000745号</span>
      </a>
    </div>
    <div id="siteVersion" class="site-version">版本 2.0.0 · Liquid Glass Edition</div>
  </div>
</div>

<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/liquid-motion.js"></script>
<script src="assets/js/admin-1.js"></script>
<script src="assets/js/admin-2.js"></script>
</body>
</html>
