<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐投稿</title>
<link rel="stylesheet" href="assets/css/vote.css">
</head>
<body>
<div class="box">
  <h2>音乐投稿</h2>
  <!-- 暂停接收投稿时的提示条：默认隐藏，进页面问一次 /api/config 再决定显示。
       目的是"打开就知道"，而不是填完表单点提交才吃一个 403。 -->
  <p id="pausedNotice" class="paused-notice" style="display:none;"></p>
  <p class="sub">每人每周只能投稿一首，请慎重提交</p>
  <label class="field-label" for="title">歌名（同时是搜索框）</label>
  <input id="title" placeholder="输入歌名或歌手，回车搜索" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();searchSongs();}">
  <label class="field-label" for="artist">歌手（由搜索结果填入）</label>
  <input id="artist" placeholder="从搜索结果里选一首，歌手会自动填入" readonly style="background:#f1f5f9;color:#334155;">
  <input id="trackId" type="hidden" value="">
  <!-- 选曲凭据（A7）：搜索接口为每个候选签发的服务端签名串。
       它把「歌名 + 歌手 + 音源 id 属于同一首歌」变成服务端可验证的事实，
       所以提交时必须一起带上；不再靠"三个字段各查各的格式"来兜底。 -->
  <input id="trackToken" type="hidden" value="">
  <p id="picked" class="sub" style="color:#0284c7;min-height:16px;margin:2px 0 6px;"></p>
  <label class="field-label" for="category">分类</label>
  <select id="category">
    <option value="2">中文歌</option>
    <option value="3">英文歌</option>
    <option value="1">纯音乐</option>
    <option value="4">小语种</option>
  </select>
  <button onclick="searchSongs()" style="background:rgba(255,255,255,0.8);color:#64748b;box-shadow:none;border:1px solid #e2e8f0;">搜索歌曲</button>
  <div id="searchBox"></div>
  <!-- 游客模式下这个按钮必须点不了，所以**默认就是 disabled**：
       进页面后由 /api/me 确认身份，不是游客才解开。
       这样"填完表单才被拒"的情况不会发生 —— 游客一进来就看到它是灰的。
       代价：正常学生在前一两百毫秒里看到的是灰按钮，可接受。 -->
  <button id="submitVoteBtn" onclick="vote()" disabled aria-disabled="true" title="正在确认身份，请稍候">提交点歌</button>
  <button onclick="auditionInput()" style="background:rgba(255,255,255,0.8);color:#64748b;box-shadow:none;border:1px solid #e2e8f0;">▶ 先试听一下</button>
  <p id="msg"></p>
  <div id="auditionBox"></div>
  <!-- 这两个按钮原本在 .box 外面，宽度与卡片内的其它按钮对不齐（用户反馈"像素没对齐"）。
       放进 .box 里之后，宽度、圆角、左右内边距都和「搜索歌曲 / 提交点歌」一致。 -->
  <button class="back" onclick="location.href='/'">返回主页</button>
  <button class="back" onclick="logoutUser()">退出登录</button>
</div>

       style="color:var(--ink-3);text-decoration:none;">苏ICP备2026011040号</a>
    <span style="color:var(--ink-4);">|</span>
    <a id="beianGongan" href="https://beian.mps.gov.cn/#/query/webSearch?code=32090302000745" target="_blank" rel="noopener noreferrer"

      <span id="beianGonganText">苏公网安备32090302000745号</span>

  <div id="siteVersion" style="margin-top:4px;font-size:11px;color:var(--ink-4);letter-spacing:.02em;">版本 1.1.1</div>
</div>
