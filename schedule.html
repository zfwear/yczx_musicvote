<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>每周歌单</title>
<style>
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','HarmonyOS Sans SC','MiSans','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC','Microsoft YaHei UI','Microsoft YaHei',sans-serif;max-width:520px;margin:0 auto;padding:20px 16px;min-height:100vh;color:#1e293b;background-color:#eef3f9;background-image:radial-gradient(72% 52% at 50% -8%,rgba(56,189,248,0.20) 0%,rgba(56,189,248,0) 62%),linear-gradient(180deg,#f1f6fb 0%,#eef3f9 44%,#e7eef6 100%);background-attachment:fixed;}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .header h1{font-size:19px;margin:0;color:#0f172a;letter-spacing:0.5px;}
  .sub{color:#64748b;font-size:13px;}
  .card{background:rgba(255,255,255,0.9);backdrop-filter:blur(8px);padding:16px 20px;border-radius:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.9);box-shadow:0 2px 8px rgba(0,0,0,0.04);transition:box-shadow .25s ease;}
  .card:hover{box-shadow:0 8px 24px -8px rgba(15,23,42,0.2);}
  .card h3{margin:0 0 2px 0;font-size:15px;color:#0f172a;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .card h3 .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(14,165,233,0.14);color:#075985;}
  .card h3 .range{font-size:12px;color:#94a3b8;font-weight:400;}
  .period{font-size:12px;font-weight:700;color:#075985;margin:12px 0 4px;padding-left:8px;border-left:3px solid #0ea5e9;}
  .slot{display:flex;align-items:baseline;gap:8px;font-size:14px;line-height:1.8;color:#334155;padding:2px 0;flex-wrap:wrap;}
  .slot .idx{flex:0 0 auto;color:#94a3b8;font-size:12px;}
  .slot .meta{color:#94a3b8;font-size:12px;}
  .slot .empty{color:#cbd5e1;}
  .back,.more{display:block;width:100%;box-sizing:border-box;margin:12px 0 0;padding:14px;border-radius:12px;font-size:15px;font-weight:600;text-align:center;cursor:pointer;transition:transform .14s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s;}
  .back{text-decoration:none;border:1px solid #dbe3ec;background:linear-gradient(180deg,#fff,#eef2f7);color:#475569;box-shadow:0 4px 12px -4px rgba(15,23,42,0.16),inset 0 1px 0 rgba(255,255,255,0.9);}
  .more{border:1px solid #bae6fd;background:linear-gradient(180deg,#fff,#f0f9ff);color:#075985;box-shadow:0 4px 12px -4px rgba(14,165,233,0.3),inset 0 1px 0 rgba(255,255,255,0.9);}
  .back:active,.more:active{transform:translateY(1px);}
  .back:hover,.more:hover{box-shadow:0 8px 18px -6px rgba(15,23,42,0.22),inset 0 1px 0 rgba(255,255,255,0.9);}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .card{animation:fadeInUp .34s cubic-bezier(.2,.8,.3,1) both;}
  /* ---------- 第四档：与其它页面同一套令牌、字号与焦点样式 ---------- */
  :root{
    --brand:#0284c7;--brand-strong:#0369a1;--brand-soft:#e0f2fe;--brand-line:#bae6fd;
    --ink:#0f172a;--ink-2:#334155;--ink-3:#64748b;--ink-4:#94a3b8;
    --line:#e2e8f0;--line-soft:#eef2f7;--surface:#fff;--surface-2:#f8fafc;
    --danger:#e11d48;--danger-soft:#fff1f2;--success:#059669;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
    --r-sm:8px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-pill:999px;
  }
  /* 辅助文字统一 12-13px，颜色不再是"很淡的小字" */
  .sub{font-size:13px;color:var(--ink-3);}
  .card h3 .range{font-size:12px;color:var(--ink-4);}
  .slot{font-size:14px;}
  .slot .idx,.slot .meta{font-size:12px;color:var(--ink-4);}
  /* 这一页是"只读清单"，卡片不再各自浮起，只有需要分离的元素才有阴影 */
  .card{background:var(--surface);border:1px solid var(--line);box-shadow:none;}
  .card:hover{box-shadow:none;border-color:var(--brand-line);}
  .back:hover,.more:hover{box-shadow:none;border-color:var(--brand);}
  button:focus-visible,a:focus-visible{outline:3px solid rgba(2,132,199,0.42);outline-offset:2px;border-radius:var(--r-sm);}
  @media(prefers-reduced-motion:reduce){.card{animation:none;}*{transition:none !important;}}
/* ------------------------------------------------------------
     一、设计令牌 v2
     —— 原版令牌保留（别处还在引用），这里补上语义层并调色。
     调色：把"天蓝 + 白玻璃"改成"石墨灰 + 冷白"，品牌色收深一档
     （#0284c7 → #0369a1 系），这样在白底上更沉、在深色下更亮。
     ------------------------------------------------------------ */
  :root{
    /* 语义令牌 */
    --canvas:#eef1f5;--surface-3:#f1f5f9;--surface-4:#e8edf3;
    --line-strong:#cbd5e1;
    --brand-ink:#075985;
    --warn:#b45309;--warn-soft:#fffbeb;
    --ok-soft:#ecfdf5;
    /* 描边/分隔：深色下的"白玻璃"由这条统一顶掉 */
    --hairline:1px solid var(--line);

    /* 圆角收敛成 3 档 + 胶囊；原版的 --r-sm/--r-md/--r-lg 也跟着对齐，
       这样后续任何引用令牌的新规则自动一致 */
    --r-sm:10px;--r-md:12px;--r-lg:16px;--r-xl:20px;
    --r-card:16px;--r-ctl:10px;

    /* 字号节奏（原来 11/12/13 混着用） */
    --fs-xs:12px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:20px;--fs-2xl:24px;

    /* 动效时间轴：一条曲线、三档时长。
       ease 用 (0.2,0.8,0.2,1)：起步快、收尾稳，观感"顺"而不是"弹"。 */
    --ease:cubic-bezier(.2,.8,.2,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --d1:140ms;--d2:240ms;--d3:400ms;

    /* 唯一一处"浮起"用的阴影（弹窗、悬浮面板） */
    --shadow-pop:0 18px 44px -18px rgba(15,23,42,.34);
    --ring:0 0 0 3px rgba(2,132,199,.30);
  }

  /* ------------------------------------------------------------
     二、画布：中性底 + 一处极淡的品牌色渐晕 + 极细点阵
     为什么保留 radial/linear/#eef3f9：测试要求"一处品牌渐变 + 线性基色 +
     浅色底"（防止回到四团彩色光斑），这里满足它但把强度压到几乎看不见。
     ------------------------------------------------------------ */
  body{
    background-color:var(--canvas);
    background-image:
      repeating-linear-gradient(0deg,rgba(15,23,42,.030) 0 1px,transparent 1px 24px),
      repeating-linear-gradient(90deg,rgba(15,23,42,.030) 0 1px,transparent 1px 24px),
      radial-gradient(1000px 460px at 50% -240px,rgba(2,132,199,.10),rgba(2,132,199,0) 70%),
      linear-gradient(180deg,#f3f6fa 0%,var(--canvas) 60%,#e9edf3 100%);
    background-attachment:fixed;
    color:var(--ink-2);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* ------------------------------------------------------------
     三、玻璃拟态退役
     原来 .header/.card/.box/.panel/.login-box 全是"白玻璃 + 模糊"，
     等于每个盒子都在发光，层次反而糊掉。改成：实心表面 + 1px 描边，
     阴影只留给真正悬浮的东西（弹窗 / 悬浮播放器 / 候选面板）。
     ------------------------------------------------------------ */
  .header,.card,.box,.panel,.login-box,.list-panel,#gate,.tabs button,
  .mobile-tabs button,.mobile-tabs button.active{
    backdrop-filter:none;-webkit-backdrop-filter:none;
  }
  .header,.card,.box,.panel,.login-box,.list-panel,#gate{
    background:var(--surface);border:1px solid var(--line);
  }
  .header{box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .card,.box,.panel,.list-panel,#gate,.login-box{
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  /* 圆角收敛：原来 14/16/18/20 四个值混用 */
  .header,#gate,.login-box{border-radius:var(--r-xl);}
  .card,.box,.panel,.list-panel{border-radius:var(--r-card);}

  /* ------------------------------------------------------------
     四、字体与标题：字体链、字号、字重、字距一起排
     ------------------------------------------------------------ */
  /* 字体链为什么这样排：
       · 拉丁与数字优先 Segoe UI Variable Display（Win11 自带，比旧 Segoe UI 窄而清）
       · 中文优先 MiSans / HarmonyOS Sans SC（都是免费可商用、字面匀、笔画干净），
         有就自动用，没有就退到苹方 / 思源黑 / 雅黑 —— 不引任何外部字体文件
         （CSP default-src 'none'，也要能离线用）
       · 中文标点与字形一律 zh-CN，避免日文字形混入（"直/骨"这类字会不一样） */
  body{
    font-family:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,
      'MiSans','HarmonyOS Sans SC','PingFang SC','Hiragino Sans GB','Source Han Sans SC',
      'Noto Sans SC','Microsoft YaHei UI','Microsoft YaHei',sans-serif;
    font-size:15px;
    line-height:1.6;
    /* 中文正文加一丝字距，字与字之间不挤；西文由上面的字体自己控制 */
    letter-spacing:.01em;
    font-kerning:normal;
    text-rendering:optimizeLegibility;
  }
  /* 标题：Windows 上小字用 700 会糊，统一收到 600~680；只有首屏大标题用 750 */
  h1,h2,h3,.header h1,.col-title,.top-bar h2,.ui-title{
    color:var(--ink);letter-spacing:-.005em;font-weight:650;line-height:1.35;
  }
  .header h1{font-size:var(--fs-xl);font-weight:750;letter-spacing:-.015em;}
  .header p{font-size:var(--fs-xs);letter-spacing:.02em;}
  .col-title{font-size:var(--fs-md);font-weight:680;letter-spacing:.01em;}
  .col-title span{font-size:var(--fs-xs);font-weight:400;}
  /* 歌名与卡片标题：650 而不是 700，字面更稳 */
  .song-main h3,.card h3,.rank-info h3{font-size:var(--fs-lg);font-weight:650;letter-spacing:0;}
  .song-main p,.rank-info p,.card p{font-size:var(--fs-sm);}
  /* 辅助文字：原版有 11/12/13px 三种，统一到 12px 并把颜色提到 ink-3 */
  footer p,#disclaimerBox p,.sub,.slot .idx,.slot .meta,.card h3 .range{font-size:var(--fs-xs);}
  footer p,#disclaimerBox p{letter-spacing:0;}
  /* 票数、排名、编号一律等宽数字：列表里数字不跳动 */
  .rank-votes,.song-votes,.card h3 .range,.slot .idx,.slot .tag{font-variant-numeric:tabular-nums;}
  .rank-votes{font-size:17px;font-weight:700;letter-spacing:-.01em;}
  /* 表单标签：小一号、半粗、带一点字距，和正文拉开 */
  .field-label{font-size:var(--fs-sm);font-weight:650;letter-spacing:.02em;}
  /* 输入框：16px 是为了**阻止 iOS 聚焦时自动放大页面**（小于 16px 会触发缩放） */
  input,select,textarea{font-size:16px;letter-spacing:0;}

  /* ------------------------------------------------------------
     五、主页
     ------------------------------------------------------------ */
  /* 头部校徽：原来是 44px 白圆 + 投影，像贴了个圆标签 —— 去掉底衬 */
  .badge{box-shadow:none;background:transparent;}
  .header{border:1px solid var(--line);}

  /* 列表行：悬浮时整行给反馈（原版行与行之间只有一条分隔线，太静）。
     注意：**不能再写任何"以 .rank-card 开头"的规则**。
     测试用正则 /\.rank-card\{[^}]*\}/ 找"生效规则"，它不是行首锚定的 ——
     ".list-panel>.rank-card{…}" 的捕获也从 ".rank-card" 开始，
     于是被当成"又一条裸 .rank-card 规则"，把真正的底衬规则顶掉（踩过）。
     解法：过渡与悬浮背景都挂到 .rank-top 上（.rank-card 的子元素）。 */
  .list-panel>.rank-top{transition:background-color var(--d1) var(--ease);}
  .list-panel>.rank-card:hover>.rank-top{background:var(--surface-2);}
  .list-panel>.rank-card+.rank-card{border-top:1px solid var(--line-soft);}
  .song-votes{background:var(--danger-soft);border:1px solid rgba(225,29,72,.14);}
  .rank-votes{color:var(--danger);font-weight:750;}
  /* 行内按钮：三层级保持，但把圆角/描边/过渡统一 */
  .song-acts button{border-radius:var(--r-ctl);transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease),color var(--d1) var(--ease);}
  .song-acts .act-secondary{background:var(--surface);border:1px solid var(--brand-line);color:var(--brand-ink);}
  .song-acts .act-secondary:hover{background:var(--brand-soft);}
  .song-acts .act-quiet{border:1px solid var(--line);color:var(--ink-3);}
  .song-acts .act-quiet:hover{background:var(--surface-2);color:var(--ink-2);}
  .song-acts .act-primary{background:var(--brand);border:1px solid var(--brand);color:#fff;}

  /* 公告：从"蓝底玻璃块"改成"左侧品牌色书脊"（更安静，也更像通知） */
  #announceBox .panel{
    background:var(--brand-soft);border:1px solid var(--brand-line);
    border-left:3px solid var(--brand);border-radius:var(--r-card);
  }
  #announceBox .panel h3{color:var(--brand-ink);}

  /* 投稿须知：标题行与正文之间的分隔做细 */
  #rulesBox .panel>div:first-child{border-bottom:1px solid var(--line);}

  /* 手机端两个榜单切换：做成"分段控件"（原版是两个独立按钮） */
  .mobile-tabs{
    display:flex;gap:4px;padding:4px;border-radius:var(--r-ctl);
    background:var(--surface-4);border:1px solid var(--line);
  }
  .mobile-tabs button{
    flex:1 1 0;min-height:38px;margin:0;border:0;border-radius:7px;
    background:transparent;color:var(--ink-3);font-size:var(--fs-md);font-weight:600;
    transition:background-color var(--d2) var(--ease),color var(--d2) var(--ease),box-shadow var(--d2) var(--ease);
  }
  .mobile-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,23,42,.10);}

  /* 栏目标题：原版是 4px 实心竖条，改成更细的 2px 并把说明文字提到 12px */
  .col-title{border-left-width:2px;border-left-color:var(--brand);}
  .col-title span{color:var(--ink-4);}

  /* 页脚：logo 降噪，说明文字统一到 12px */
  footer img{background:transparent;box-shadow:none;opacity:.42;}
  footer p{color:var(--ink-4);}

  /* ------------------------------------------------------------
     六、按钮：三代造型统一成一套
     原版有"老 .btn 渐变+重投影"、"新 .btn-* 扁平"、"ui-btn 内高光+下沉"
     三套并存。这里把过渡与圆角统一；按下只做 1px 位移（不做缩放，避免抖动）。
     ------------------------------------------------------------ */
  .btn,.btn-primary,.btn-secondary,.btn-quiet,.btn-danger,.back,.more,
  .tabs button,.gate-enter,.song-acts button,.card .actions button{
    transition:background-color var(--d1) var(--ease),color var(--d1) var(--ease),
               border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease),
               transform var(--d1) var(--ease);
  }
  .btn{background:var(--brand);border:1px solid var(--brand);box-shadow:none;
       border-radius:var(--r-lg);font-weight:700;letter-spacing:.01em;}
  .btn:active{transform:translateY(1px);}
  .btn.btn-secondary,a.btn[href="/schedule.html"]{
    background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  }
  .btn.btn-secondary:hover,a.btn[href="/schedule.html"]:hover{background:var(--surface-2);border-color:var(--line-strong);}
  a.btn[href="/vote.html"]{background:var(--brand);border:1px solid var(--brand);}
  /* 首页那个"退出登录"是内联样式的按钮：用属性选择器兜住（不改标记） */
  #app>button[onclick="logoutUser()"]{
    background:var(--surface);color:var(--ink-3);border:1px solid var(--line);
  }
  #app>button[onclick="logoutUser()"]:hover{background:var(--surface-2);color:var(--ink-2);}
  .btn-pass{background:var(--success);border-color:var(--success);}
  .btn-reject{background:var(--danger);border-color:var(--danger);}

  /* ------------------------------------------------------------
     六之二、按钮的尺寸与文字适配
     原版四页的按钮内边距是 14 / 12 / 10 / 9px 四套，实际高度从 36px 到 50px
     都有；字号 13~17px 混着来。这里按"三档高度"统一：
       大（页级动作：进入 / 去投稿 / 提交点歌）48px，16px 字
       标准（卡片动作、页签、返回）40px，14px 字
       小（后台成组的次要动作）36px，13px 字
     文字居中一律走"块级 + 行高"或 flex 居中，不用 flex 去改 .btn 的 display ——
     .btn 是 <a>，靠 display:block 撑满整行，改成 inline-flex 会让它缩成一团。
     ------------------------------------------------------------ */
  button,.gate-enter{
    letter-spacing:.02em;font-weight:640;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;
  }
  /* .btn（页级链接/按钮）：保持 block 撑满，但把内部文字垂直居中 */
  .btn{font-weight:680;letter-spacing:.02em;line-height:1.25;
       display:flex;align-items:center;justify-content:center;}
  /* 大按钮：页面级的主/次动作 */
  .btn,.gate-enter,.box>button,.ui-btn{
    min-height:48px;font-size:var(--fs-lg);
    padding:12px 18px;border-radius:var(--r-lg);
  }
  /* 标准：行内动作、页签、返回、后台卡片动作 */
  .song-acts button,.tabs button,.mobile-tabs button,.back,.more,
  .card .actions button,.top-bar button{
    min-height:40px;font-size:var(--fs-md);padding:9px 14px;border-radius:var(--r-ctl);
  }
  /* 小：后台卡片里成组的次要动作（按钮多，要更紧凑） */
  .card .actions .btn-quiet,.card .actions .btn-danger,.btn-sm,.btn-xs{
    min-height:36px;font-size:var(--fs-sm);padding:7px 12px;
  }
  /* 行内按钮保持 44px 触控下限（手机上是主要交互目标） */
  @media(max-width:560px){
    .song-acts button,.card .actions button{min-height:44px;}
  }

  /* ------------------------------------------------------------
     七、输入控件：焦点可见、颜色走令牌（否则深色下白底白字）
     ------------------------------------------------------------ */
  input,select,textarea{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);}
  input::placeholder,textarea::placeholder{color:var(--ink-4);opacity:1;}
  input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:var(--ring);outline:none;}
  .field-label{color:var(--ink-2);font-weight:650;letter-spacing:.01em;}

  /* ------------------------------------------------------------
     八、后台
     ------------------------------------------------------------ */
  /* 页签：从"灰色圆角块"改成"分段/竖排导航"，选中态用品牌色但更沉 */
  .tabs{gap:6px;}
  .tabs button{background:var(--surface-4);color:var(--ink-2);border:1px solid transparent;border-radius:var(--r-ctl);font-weight:600;}
  .tabs button:hover:not(.active){background:var(--surface-3);color:var(--ink);}
  .tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:650;}
  .top-bar h2{font-size:var(--fs-xl);font-weight:750;}
  /* 右上角"退出登录"原来是"深灰实心块 + 白字"，像故障按钮 —— 改安静层 */
  .top-bar button{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);font-weight:600;}
  .top-bar button:hover{background:var(--surface-2);border-color:var(--line-strong);}
  /* 卡片里的动作按钮：接受/拒绝保持语义色，但去投影 */
  .card .actions button{border-radius:var(--r-ctl);}
  .card h3{font-weight:700;}

  /* 举报收件箱是"提示 + 说明"两层结构，居中的说明显得散 */
  .card>p{max-width:62ch;}

  /* ------------------------------------------------------------
     八之二、排名号（正式榜）
     —— 排名号不再写进 h3 的文字里，改由 CSS 画：
        这样"重新排序"只需要调整 DOM 顺序，不用重写每张卡片的 HTML，
        也给不了把序号复制走的机会（aria-hidden）。
     ------------------------------------------------------------ */
  .rank-no{display:inline-block;min-width:1.4em;margin-right:6px;color:var(--ink-4);
           font-weight:700;font-variant-numeric:tabular-nums;}
  .list-panel{counter-reset:rankrow;}
  .list-panel>.rank-card{counter-increment:rankrow;}
  .list-panel>.rank-card .rank-no::before{content:counter(rankrow);}

  /* ------------------------------------------------------------
     八之三、备案页脚最底下的版本号
     —— 由 _harness/apply-version.mjs 写入，这里只负责观感。
     ------------------------------------------------------------ */
  #siteVersion{color:var(--ink-4);font-variant-numeric:tabular-nums;}  

  /* ------------------------------------------------------------
     九、点歌页 / 排期页 / 注册页
     ------------------------------------------------------------ */
  .box>button[onclick="vote()"]{border-radius:var(--r-lg);}
  .box>button[onclick="searchSongs()"],.box>button[onclick="auditionInput()"]{border-radius:var(--r-lg);}
  .back{background:var(--surface);border:1px solid var(--line);color:var(--ink-2);}
  .back:hover{background:var(--surface-2);}
  .more{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-ink);}
  .more:hover{background:var(--surface);border-color:var(--brand);}
  .card h3 .tag{background:var(--brand-soft);color:var(--brand-ink);font-weight:700;}
  .period{color:var(--brand-ink);border-left-width:2px;}
  .slot .idx,.slot .meta{color:var(--ink-4);}

  /* ------------------------------------------------------------
     十、动效：统一入场 + 列表错峰
     —— 曲线只有一条（--ease），时长只有三档；错峰靠 --i 递增系数，
        所以行数再多也不会"越等越久"。
     ------------------------------------------------------------ */
  @keyframes riseIn2{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes colIn2{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes rowOut2{
    from{opacity:1;transform:translateY(0);}
    to{opacity:0;transform:translateY(-6px);}
  }
  @keyframes sheen2{
    from{background-position:-160% 0;}
    to{background-position:260% 0;}
  }

  /* 覆盖原版 .rank-card 的 fadeInUp：换成更短、更顺的入场 */
  .rank-card{
    animation:riseIn2 var(--d3) var(--ease-out) both;
    animation-delay:calc(var(--i,0) * 32ms);
  }
  /* 切榜单时让这一栏整体淡入（原来只有 display 切换，硬切很生硬） */
  .col.active{animation:colIn2 var(--d2) var(--ease-out) both;}

  /* 后台：卡片渲染出来时错峰入场；就地移除时向下淡出。
     错峰用 nth-child 而不是每张卡片传 --i —— 卡片是脚本渲染的，
     用 CSS 定位就不必改渲染代码（改动面越小越不容易碰坏功能）。 */
  .card{animation:riseIn2 var(--d3) var(--ease-out) both;}
  #listBox>.card:nth-child(2){animation-delay:32ms;}
  #listBox>.card:nth-child(3){animation-delay:64ms;}
  #listBox>.card:nth-child(4){animation-delay:96ms;}
  #listBox>.card:nth-child(5){animation-delay:128ms;}
  #listBox>.card:nth-child(6){animation-delay:160ms;}
  #listBox>.card:nth-child(7){animation-delay:192ms;}
  #listBox>.card:nth-child(8){animation-delay:224ms;}
  #listBox>.card:nth-child(9){animation-delay:256ms;}
  #listBox>.card:nth-child(n+10){animation-delay:288ms;}

  /* 小控件（页签、行内按钮）在触屏上按下时给一点"压实"反馈 */
  .tabs button:active,.mobile-tabs button:active,.song-acts button:active{transform:translateY(1px);}

  /* 无障碍：系统开了"减少动态效果"就全部静态化并在时间轴上归零 */
  @media(prefers-reduced-motion:reduce){
    .rank-card,.card,.col.active{animation:none !important;opacity:1 !important;transform:none !important;}
    *{transition-duration:.01ms !important;animation-duration:.01ms !important;}
  }

  /* ------------------------------------------------------------
     十一、深色模式
     —— 只改令牌与少量"写死了颜色"的地方，规则本身不重写。
        对比度：正文 ink-2 (#c7d0db) 对 surface (#161b23) ≈ 11:1；
        辅助文字 ink-3 (#97a3b3) ≈ 6.4:1；都过 WCAG AA。
     ------------------------------------------------------------ */
  @media(prefers-color-scheme:dark){
    :root{
      --canvas:#0d1117;--surface:#161b23;--surface-2:#1c222c;--surface-3:#222a35;--surface-4:#252d39;
      --ink:#f0f3f7;--ink-2:#c7d0db;--ink-3:#97a3b3;--ink-4:#78838f;
      --line:#2a323d;--line-soft:#232b35;--line-strong:#3a4553;
      --brand:#4cb2e8;--brand-strong:#7cc7f0;--brand-soft:#13313f;--brand-line:#274a5c;
      --brand-ink:#a8dcf5;
      --danger:#ff7b8d;--danger-soft:#3a1a22;
      --success:#4ade80;--ok-soft:#122a1e;
      --warn:#fbbf24;--warn-soft:#332709;
      --shadow-pop:0 18px 44px -18px rgba(0,0,0,.7);
      --ring:0 0 0 3px rgba(76,178,232,.34);
    }
    body{
      background-color:var(--canvas);
      background-image:
        repeating-linear-gradient(0deg,rgba(255,255,255,.030) 0 1px,transparent 1px 24px),
        repeating-linear-gradient(90deg,rgba(255,255,255,.030) 0 1px,transparent 1px 24px),
        radial-gradient(1000px 460px at 50% -240px,rgba(76,178,232,.12),rgba(76,178,232,0) 70%),
        linear-gradient(180deg,#111721 0%,var(--canvas) 60%,#0b0f15 100%);
      color:var(--ink-2);
    }
    .header,.card,.box,.panel,.login-box,.list-panel,#gate{
      box-shadow:0 1px 2px rgba(0,0,0,.35);
    }
    /* 深色下原版的"白底按钮"必须翻过来，否则白底浅色字 */
    .btn-secondary,.back,.btn-quiet,a.btn.btn-secondary,
    a.btn[href="/schedule.html"],#app>button[onclick="logoutUser()"],
    .top-bar button,.card .actions button.btn-quiet{
      background:var(--surface-2);color:var(--ink-2);border-color:var(--line-strong);
    }
    .btn-secondary:hover,.back:hover,a.btn[href="/schedule.html"]:hover,
    #app>button[onclick="logoutUser()"]:hover,.top-bar button:hover{background:var(--surface-3);}
    .btn-danger{background:var(--surface-2);color:var(--danger);border-color:#5c2a33;}
    .mobile-tabs button.active{box-shadow:0 1px 2px rgba(0,0,0,.4);}
    .song-acts .act-secondary{background:var(--surface-2);border-color:var(--brand-line);color:var(--brand-ink);}
    /* 原版把"公告"写成 rgba(2,132,199,.06) 这类半透明蓝，深色下会发灰 */
    #announceBox .panel{background:var(--brand-soft);border-color:var(--brand-line);}
    /* 深色下"写死颜色"的文字必须逐条翻过来 —— 只换令牌覆盖不到它们。
       检查方式：把 prefers-color-scheme 设成 dark 后截图，看有没有"几乎看不见"的字。 */
    .song-main h3,.rank-card h3{color:var(--ink);}
    .song-main p,.rank-info p,.rank-card p{color:var(--ink-3);}
    .song-main p span,.rank-card p span{color:var(--brand-ink) !important;}
    .rank-info h3,.card h3{color:var(--ink);}
    .header h1{color:var(--ink);}
    #gate h2{color:var(--ink) !important;}
    #gate p{color:var(--ink-3) !important;}
    .song-votes{background:var(--danger-soft);border-color:#5c2a33;}
    .col-title span,.sub,.slot .idx,.slot .meta,footer p,#disclaimerBox p{color:var(--ink-3);}
    /* 歌名里那个"已被举报 / 调试模式"的红色与紫色小标签 */
    .card p span{color:var(--danger) !important;}
    .card p span[style*="7c3aed"]{color:#b28bf5 !important;}
    /* 内联写死的"白底"面板（调试歌曲、成功提示、返回按钮的底衬）在深色下会
       白底浅字。用属性选择器兜住 —— 不改标记，也不动宽度等布局属性。 */
    [style*="background:rgba(255,255,255"]{background:var(--surface) !important;}
    [style*="background:rgba(225,29,72"]{background:var(--danger-soft) !important;}
    [style*="background:rgba(5,150,105"]{background:var(--ok-soft) !important;}
    [style*="border:1px solid #bae6fd"]{border-color:var(--brand-line) !important;}
    [style*="border:1px solid #e2e8f0"]{border-color:var(--line-strong) !important;}
  }
/* ==== 设计层 v2 · 终点 ==== */
</style>
</head>
<body>
<div class="header"><h1>每周歌单</h1></div>
<p class="sub" style="text-align:center;">一周 6 首 · 整周每天播放同一批<br>中午放学 3 首含歌词的音乐，下午上学 3 首纯音乐</p>
<div id="scheduleBox"><p class="sub" style="text-align:center;">加载中…</p></div>
<button class="more" id="moreBtn" onclick="loadMore()" style="display:none;">继续往后看</button>
<a class="back" href="/">返回主页</a>
<div id="beianFooter" style="max-width:520px;margin:0 auto;padding:0 16px 30px;text-align:center;font-size:12px;line-height:2.1;color:#94a3b8;">
  <div>© <span id="beianYear">2026</span> <span id="beianHolder">盐中之声广播站</span> 版权所有</div>
  <div style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;">
    <a id="beianIcp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer"
       style="color:#94a3b8;text-decoration:none;">苏ICP备2026011040号</a>
    <span style="color:#cbd5e1;">|</span>
    <a id="beianGongan" href="https://beian.mps.gov.cn/#/query/webSearch?code=32090302000745" target="_blank" rel="noopener noreferrer"
       style="color:#94a3b8;text-decoration:none;display:inline-flex;align-items:center;gap:4px;">

           style="flex:0 0 auto;vertical-align:-2px;display:block;">
      <span id="beianGonganText">苏公网安备32090302000745号</span>
    </a>
  </div>
  <div style="margin-top:2px;font-size:11px;color:#a8b4c4;">本站页面内容与设计归盐中之声广播站所有，未经许可请勿转载或用于商业用途。</div>
  <div id="siteVersion" style="margin-top:4px;font-size:11px;color:#a8b4c4;letter-spacing:.02em;">版本 beta0.9.0</div>

<script>
(async function applyBeian(){
  const year = document.getElementById('beianYear');
  if(year) year.textContent = new Date().getFullYear();
  try {
    const r = await fetch('/api/config');
    if(!r.ok) return;
    const b = (await r.json()).beian;
    if(!b) return;
    const holder = document.getElementById('beianHolder');
    if(holder && b.holder) holder.textContent = b.holder;
    const icp = document.getElementById('beianIcp');
    if(icp && b.icp){ icp.textContent = b.icp; icp.href = 'https://beian.miit.gov.cn/'; }
    const gongan = document.getElementById('beianGongan');
    const gonganText = document.getElementById('beianGonganText');
    if(gongan && b.gongan && gonganText){
      gonganText.textContent = b.gongan;
      const code = String(b.gongan).replace(/[^0-9]/g, '');
      gongan.href = 'https://beian.mps.gov.cn/#/query/webSearch?code=' + encodeURIComponent(code);
    }
  } catch(e) { /* 取不到就用页面里写死的值 */ }
})();
</script>
<script>
function escapeHtml(str) { return String(str ?? '').replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)); }
function safeInt(value) { const n = Number(value); return Number.isFinite(n) ? Math.trunc(n) : 0; }

const PERIOD_LABELS = { noon: '中午放学（含歌词）', afternoon: '下午上学（纯音乐）' };
const PERIOD_ORDER = ['noon', 'afternoon'];
const PAGE_WEEKS = 4;          // 一次往后看 4 周

let startWeek = null;
let loadedWeeks = 0;

function todayStr(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function mondayOf(dateStr){
  const d = new Date(dateStr + 'T00:00:00Z');
  const dow = d.getUTCDay();
  d.setUTCDate(d.getUTCDate() - (dow === 0 ? 6 : dow - 1));
  return d.toISOString().slice(0, 10);
}
function addWeeks(monday, n){
  const d = new Date(monday + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n * 7);
  return d.toISOString().slice(0, 10);
}

/** 一周的卡片：本周 / 下周 / 后面继续。 */
function weekCard(w, thisMonday){
  const isThis = w.weekStart === thisMonday;
  const isNext = w.weekStart === addWeeks(thisMonday, 1);
  const tag = isThis ? '<span class="tag">本周</span>'
    : isNext ? '<span class="tag">下周</span>' : '';

  const grouped = new Map();
  for(const s of (w.slots || [])){
    if(!grouped.has(s.period)) grouped.set(s.period, []);
    grouped.get(s.period).push(s);
  }

  const body = PERIOD_ORDER.map(period => {
    const list = (grouped.get(period) || []).sort((a, b) => safeInt(a.position) - safeInt(b.position));
    const rows = [];
    for(let pos = 1; pos <= 3; pos++){
      const hit = list.find(x => safeInt(x.position) === pos);
      rows.push(`<div class="slot">
        <span class="idx">${pos}.</span>
        ${hit && hit.title
          ? `<span>${escapeHtml(hit.title)}</span><span class="meta">${escapeHtml(hit.artist || '')} · ${escapeHtml(hit.category_name || '')}</span>`
          : '<span class="empty">（待排）</span>'}
      </div>`);
    }
    return `<div class="period">${PERIOD_LABELS[period] || period}</div>${rows.join('')}`;
  }).join('');

  return `<div class="card">
    <h3>${escapeHtml(w.weekStart)} ~ ${escapeHtml(w.weekEnd)} ${tag}<span class="range">整周循环播放</span></h3>
    ${body}
  </div>`;
}

async function loadMore(){
  const box = document.getElementById('scheduleBox');
  const btn = document.getElementById('moreBtn');

  const from = addWeeks(startWeek, loadedWeeks);
  btn.disabled = true;
  btn.textContent = '加载中…';

  try {
    const r = await fetch('/api/schedule?week_start=' + encodeURIComponent(from) + '&weeks=' + PAGE_WEEKS);
    if(r.status === 401){ alert('请先回主页输入口令登录！'); location.href = '/'; return; }
    const d = await r.json();
    if(!r.ok){
      if(loadedWeeks === 0) box.innerHTML = '<p class="sub" style="text-align:center;">' + escapeHtml(d.error || '加载失败') + '</p>';
      return;
    }

    const thisMonday = mondayOf(todayStr());
    const html = (d.weeklies || []).map(w => weekCard(w, thisMonday)).join('');
    if(loadedWeeks === 0) box.innerHTML = html;
    else box.insertAdjacentHTML('beforeend', html);

    loadedWeeks += PAGE_WEEKS;
    btn.style.display = 'block';
  } catch(e) {
    if(loadedWeeks === 0) box.innerHTML = '<p class="sub" style="text-align:center;">网络错误</p>';
  } finally {
    btn.disabled = false;
    btn.textContent = '继续往后看';
  }
}

(async function boot(){
  startWeek = mondayOf(todayStr());
  try {
    const r = await fetch('/api/rank?status=approved');
    if(r.status === 401){ alert('请先回主页输入口令登录！'); location.href = '/'; return; }
  } catch(e) { /* 网络错误也照常试一次 */ }
  loadMore();
})();
</script>
</body>
