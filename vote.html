<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐投稿 - 盐中之声</title>
<link rel="stylesheet" href="assets/css/liquid-glass.css">
<link rel="stylesheet" href="assets/css/vote.css">
</head>
<body>
<!-- 全景流体光斑 -->
<div class="liquid-mesh-layer" aria-hidden="true">
  <div class="liquid-orb liquid-orb-1"></div>
  <div class="liquid-orb liquid-orb-2"></div>
  <div class="liquid-orb liquid-orb-3"></div>
  <div class="liquid-orb liquid-orb-4"></div>
</div>

<div class="layout-container">
  <div class="glass-panel vote-card vote-container">
    <div class="vote-header">
      <div class="vote-icon-bubble">✨</div>
      <h2>音乐投稿</h2>
      <p class="sub">每人每周可投稿一首推荐曲目，请慎重挑选你最喜爱的旋律</p>
    </div>

    <!-- 暂停接收投稿时的提示条 -->
    <div id="pausedNotice" class="glass-panel notice-banner notice-paused" style="display:none;"></div>

    <div class="vote-form">
      <div class="form-group">
        <label class="field-label" for="title">歌名或歌手（实时联动搜索）</label>
        <div class="input-action-group">
          <input id="title" class="input-liquid" placeholder="输入歌名或关键词，回车搜索…" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();searchSongs();}">
          <button class="btn-liquid btn-secondary btn-sm" onclick="searchSongs()">🔍 搜索</button>
        </div>
      </div>

      <!-- 搜索候选结果面板挂载区（纯局部刷新） -->
      <div id="searchBox" class="candidates-wrap"></div>

      <div class="form-group">
        <label class="field-label" for="artist">歌手（由所选曲目自动填入）</label>
        <input id="artist" class="input-liquid" placeholder="从搜索结果中点击「选这首」自动填入" readonly>
      </div>

      <input id="trackId" type="hidden" value="">
      <input id="trackToken" type="hidden" value="">

      <!-- 已选曲目状态提示 -->
      <p id="picked" class="picked-status"></p>

      <div class="form-group">
        <label class="field-label" for="category">歌曲分类</label>
        <div class="select-wrapper">
          <select id="category" class="input-liquid select-liquid">
            <option value="2">中文歌</option>
            <option value="3">英文歌</option>
            <option value="1">纯音乐</option>
            <option value="4">小语种</option>
          </select>
        </div>
      </div>

      <div class="vote-actions-primary">
        <button id="submitVoteBtn" class="btn-liquid btn-primary" onclick="vote()" disabled aria-disabled="true" title="正在核验身份，请稍候">提交投稿</button>
        <button class="btn-liquid btn-secondary" onclick="auditionInput()">▶ 试听音源</button>
      </div>

      <p id="msg" class="vote-msg"></p>

      <!-- 试听面板挂载区 -->
      <div id="auditionBox" class="audition-box-wrap" style="display:none;"></div>

      <div class="vote-actions-nav">
        <button class="btn-liquid btn-secondary btn-sm" onclick="location.href='/'">返回主页</button>
        <button class="btn-liquid btn-secondary btn-sm" onclick="logoutUser()">退出登录</button>
      </div>
    </div>
  </div>

  <div id="beianFooter" class="beian-footer">
    <div>© <span id="beianYear">2026</span> <span id="beianHolder">盐中之声广播站</span> 版权所有 · 未经许可请勿转载或用于商业用途</div>
    <div class="beian-links">
      <a id="beianIcp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2026011040号</a>
      <span>|</span>
      <a id="beianGongan" href="https://beian.mps.gov.cn/#/query/webSearch?code=32090302000745" target="_blank" rel="noopener noreferrer">
        <img src="/assets/gongan-badge.png" alt="" width="14" height="15">
        <span id="beianGonganText">苏公网安备32090302000745号</span>
      </a>
    </div>
    <div id="siteVersion" class="site-version">版本 2.0.0 · Ultra Liquid Edition</div>
  </div>
</div>

<script src="assets/js/gsap.min.js"></script>
<script src="assets/js/liquid-motion.js"></script>
<script src="assets/js/vote-1.js"></script>
<script src="assets/js/vote-2.js"></script>
</body>
</html>
