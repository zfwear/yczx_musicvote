<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>点歌</title>
<style>
  body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;background:linear-gradient(135deg,#f0f4f8 0%,#e2e8f0 100%);min-height:100vh;color:#1e293b;}
  .box{background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(255,255,255,0.9);box-shadow:0 4px 20px rgba(0,0,0,0.05);}
  h2{text-align:center;color:#0f172a;margin-top:0;}
  p.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:20px;}
  input,select{font-size:16px;padding:14px;width:100%;box-sizing:border-box;margin:0 0 16px 0;border-radius:10px;border:1px solid #e2e8f0;background:rgba(255,255,255,0.9);}
  button{font-size:16px;padding:16px;width:100%;box-sizing:border-box;border:0;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px 0 rgba(14,165,233,0.39);transition:transform 0.2s;}
  button:active{transform:scale(0.97);}
  #msg{min-height:24px;font-size:14px;text-align:center;margin-top:12px;}
  .back{background:rgba(255,255,255,0.8);color:#64748b;box-shadow:none;border:1px solid #e2e8f0;margin-top:20px;}
</style>
</head>
<body>
<div class="box">
  <h2>点歌投票</h2>
  <p class="sub">每人每周只能点一次，请慎重提交哦</p>
  <input id="title" placeholder="歌名">
  <input id="artist" placeholder="歌手">
  <select id="category">
    <option value="2">中文歌</option>
    <option value="3">英文歌</option>
    <option value="1">纯音乐</option>
    <option value="4">小语种</option>
  </select>
  <button onclick="vote()">提交点歌</button>
  <button onclick="auditionInput()" style="background:rgba(255,255,255,0.8);color:#64748b;box-shadow:none;border:1px solid #e2e8f0;">▶ 先试听一下</button>
  <p id="msg"></p>
  <div id="auditionBox"></div>
</div>
<button class="back" onclick="location.href='/'">返回主页</button>
<script>
// 试听结果来自外部音源接口，属于不可信内容，必须转义后才能拼进 innerHTML。
function escapeHtml(str) { return String(str ?? '').replace(/[&<>'"]/g, tag => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'}[tag] || tag)); }

// 设备指纹：用于"每人每周一次"的去重，替代旧版可被"换个 User-Agent"绕过的方案。
// 刻意不使用 localStorage / Cookie，这样清缓存不会把限制重置；
// 采集的是设备与浏览器本身的稳定特征（屏幕、时区、CPU 核数、Canvas / WebGL 差异）。
async function deviceFingerprint(){
  const nav = navigator, scr = window.screen || {};
  let canvasSig = 'no-canvas';
  try {
    const c = document.createElement('canvas');
    c.width = 220; c.height = 44;
    const ctx = c.getContext('2d');
    if(ctx){
      ctx.textBaseline = 'top'; ctx.font = '14px "Arial"';
      ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 110, 22);
      ctx.fillStyle = '#069'; ctx.fillText('盐中之声 yczx', 2, 3);
      ctx.strokeStyle = 'rgba(102,204,0,.7)';
      ctx.beginPath(); ctx.arc(58, 22, 15, 0, Math.PI * 2); ctx.stroke();
      canvasSig = c.toDataURL();
    }
  } catch(e) {}
  let glSig = 'no-webgl';
  try {
    const c2 = document.createElement('canvas');
    const gl = c2.getContext('webgl') || c2.getContext('experimental-webgl');
    if(gl){
      const info = gl.getExtension('WEBGL_debug_renderer_info');
      glSig = String(info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    }
  } catch(e) {}
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
  const raw = [nav.userAgent || '', nav.platform || '', nav.language || '', (nav.languages || []).join(','),
    nav.hardwareConcurrency || '', nav.maxTouchPoints || '',
    (scr.width || 0) + 'x' + (scr.height || 0) + 'x' + (scr.colorDepth || 0),
    window.devicePixelRatio || 0, tz, canvasSig, glSig].join('|');
  // 优先用 WebCrypto；http 等非安全上下文没有 crypto.subtle 时降级为确定性哈希。
  if(window.crypto && window.crypto.subtle){
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch(e) {}
  }
  let out = '';
  for(let seed = 0; seed < 4; seed++){
    let h = (0x811c9dc5 ^ (seed * 0x9e3779b1)) >>> 0;
    for(let i = 0; i < raw.length; i++){ h ^= raw.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    out += h.toString(16).padStart(8, '0');
  }
  return out;
}

async function vote(){
  const title = document.getElementById('title').value.trim();
  const artist = document.getElementById('artist').value.trim();
  const category = document.getElementById('category').value;
  const msg = document.getElementById('msg');

  if(!title || !artist){ msg.style.color = '#e11d48'; msg.textContent = '歌名和歌手都要填哦'; return; }
  
  if(!confirm('确认提交这首歌吗？\n歌名：' + title + '\n歌手：' + artist)) return;

  msg.style.color = '#0284c7'; msg.textContent = '提交中...';
  try {
    // 不再传 password / class_id：登录态由 HttpOnly 会话 Cookie 自动携带，
    // 班级身份由服务端决定，客户端无从伪造。
    const fingerprint = await deviceFingerprint();
    const r = await fetch('/api/vote', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title, artist, category_id: category, fingerprint})
    });
    const d = await r.json();
    if(r.ok){
      msg.style.color = '#059669'; msg.textContent = '点歌成功！等待管理员审核';
      document.getElementById('title').value = '';
      document.getElementById('artist').value = '';
    } else if(r.status === 401){
      msg.style.color = '#e11d48'; msg.textContent = '登录已过期，正在返回主页…';
      setTimeout(() => { location.href = '/'; }, 1200);
    } else {
      msg.style.color = '#e11d48'; msg.textContent = d.error || '出错了';
    }
  } catch(e) { msg.style.color = '#e11d48'; msg.textContent = '网络错误'; }
}

/* ---------------- 试听 ---------------- */

// 用当前填写的歌名 / 歌手去搜。后端已做三级降级：
// 歌名+歌手 → 只按歌名 → 模糊搜索，所以输入不全时也能找到。
async function auditionInput(){
  const box = document.getElementById('auditionBox');
  const title = document.getElementById('title').value.trim();
  const artist = document.getElementById('artist').value.trim();

  // 再点一次收起
  if(box.dataset.open === '1'){
    box.dataset.open = '0';
    box.innerHTML = '';
    return;
  }
  if(!title){ alert('请先填写歌名，再点试听'); return; }

  box.dataset.open = '1';
  box.innerHTML = '<p class="sub">正在搜索音源…</p>';

  try {
    let url = '/api/music?q=' + encodeURIComponent(title);
    if(artist) url += '&artist=' + encodeURIComponent(artist);
    const r = await fetch(url);
    const d = await r.json();
    if(!r.ok){
      box.innerHTML = '<p class="sub" style="color:#e11d48;">' + escapeHtml(d.error || '搜索失败') + '</p>';
      return;
    }
    const list = Array.isArray(d.results) ? d.results : [];
    if(!list.length){
      box.innerHTML = '<p class="sub">没找到可试听的版本，换个写法再试试</p>';
      return;
    }
    box.innerHTML = list.map(s => `
      <div style="background:rgba(255,255,255,0.9);border-radius:10px;padding:10px 12px;margin:8px 0;border:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <div style="min-width:0;">
          <div style="font-size:14px;font-weight:600;color:#1e293b;word-break:break-word;">${escapeHtml(s.name)}</div>
          <div style="font-size:12px;color:#64748b;word-break:break-word;">${escapeHtml(s.artist)}　<span style="color:#0284c7;">${escapeHtml(s.source || '')}</span></div>
        </div>
        <button data-track="${escapeHtml(s.id)}" onclick="playFromButton(this)" style="width:auto;padding:8px 12px;font-size:13px;margin:0;">播放</button>
      </div>
    `).join('');
  } catch(e) {
    box.innerHTML = '<p class="sub" style="color:#e11d48;">网络错误</p>';
  }
}

// 用 data-* 传参，避免把外部返回的文本拼进 onclick 的 JS 字符串里。
function playFromButton(button){
  const box = document.getElementById('auditionBox');
  const trackId = button.dataset.track;
  if(!box || !trackId) return;

  const old = box.querySelector('audio');
  if(old) old.remove();

  const audio = document.createElement('audio');
  audio.controls = true;
  audio.preload = 'none';
  audio.src = '/api/music?play=' + encodeURIComponent(trackId);
  audio.style.width = '100%';
  audio.style.marginTop = '8px';
  box.appendChild(audio);
  audio.play().catch(() => { /* 浏览器可能拦截自动播放，忽略 */ });
}

// 进页面先确认会话仍有效（替代旧版读取 sessionStorage 里保存的口令）。
(async function(){
  try {
    const r = await fetch('/api/rank?status=pending');
    if(r.status === 401){ alert('请先回主页输入口令登录！'); location.href = '/'; }
  } catch(e) {}
})();
</script>
</body>
</html>
