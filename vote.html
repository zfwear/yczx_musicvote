<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿 · 盐中之声</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><div class="shell"><div id="nav"></div><main class="form-wrap"><section class="form-card"><span class="brand-mark">♫</span><p class="kicker">SUBMIT A TRACK</p><h1>投稿一首歌</h1><p>先搜索并选择准确的曲目，再提交给广播站审核。</p><form id="searchForm"><div class="field"><label for="query">歌名或歌手</label><input id="query" class="input" placeholder="例如：七里香 周杰伦"><div class="form-actions"><button class="btn" type="submit">搜索歌曲</button></div></div></form><div id="results" class="list"></div><form id="submitForm"><p id="picked" class="notice">尚未选择歌曲</p><div class="field"><label for="category">歌曲分类</label><select id="category" class="input"><option value="2">中文歌</option><option value="3">英文歌</option><option value="1">纯音乐</option><option value="4">小语种</option></select></div><div class="form-actions"><button class="btn primary" type="submit">提交投稿</button><a class="btn" href="/">返回首页</a></div><p id="voteMessage" class="message"></p></form></section></main><footer class="footer">投稿后由广播站审核，感谢你分享喜欢的旋律。</footer></div><script src="/assets/js/gsap.min.js"></script><script src="/assets/js/app.js"></script></body></html>
