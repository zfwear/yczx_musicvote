<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>音乐投稿</title>
<style>
  /* ============================================================
     设计令牌（四个页面各自内联一份完全相同的副本）
     —— 不能引外部 CSS 文件（CSP default-src 'none'，且要能离线用），
        所以这里把"同一个值"写四遍。改的时候四处一起改。
     ============================================================ */
  :root{
    --brand:#0284c7;--brand-strong:#0369a1;--brand-soft:#e0f2fe;--brand-line:#bae6fd;
    --ink:#0f172a;--ink-2:#334155;--ink-3:#64748b;--ink-4:#94a3b8;
    --line:#e2e8f0;--line-soft:#eef2f7;
    --surface:#ffffff;--surface-2:#f8fafc;
    --danger:#e11d48;--danger-soft:#fff1f2;--success:#059669;
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
    --r-sm:8px;--r-md:10px;--r-lg:14px;--r-xl:18px;--r-pill:999px;
  }
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI','HarmonyOS Sans SC','MiSans','PingFang SC','Hiragino Sans GB','Source Han Sans SC','Noto Sans SC','Microsoft YaHei UI','Microsoft YaHei',sans-serif;max-width:520px;margin:40px auto;padding:0 16px;min-height:100vh;color:#1e293b;background-color:#eef3f9;background-image:radial-gradient(72% 52% at 50% -8%,rgba(56,189,248,0.20) 0%,rgba(56,189,248,0) 62%),linear-gradient(180deg,#f1f6fb 0%,#eef3f9 44%,#e7eef6 100%);background-attachment:fixed;}
  .box{background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);padding:24px;border-radius:16px;border:1px solid rgba(255,255,255,0.9);box-shadow:0 4px 20px rgba(0,0,0,0.05);}
  h2{text-align:center;color:#0f172a;margin-top:0;}
  p.sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:20px;}
  input,select{font-size:16px;padding:14px;width:100%;box-sizing:border-box;margin:0 0 16px 0;border-radius:10px;border:1px solid #e2e8f0;background:rgba(255,255,255,0.9);}
  button{font-size:16px;padding:16px;width:100%;box-sizing:border-box;border:0;border-radius:14px;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 4px 14px 0 rgba(14,165,233,0.39);transition:transform 0.2s;}
  button:active{transform:scale(0.97);}
  #msg{min-height:24px;font-size:14px;text-align:center;margin-top:12px;}
  .back{background:rgba(255,255,255,0.8);color:#64748b;box-shadow:none;border:1px solid #e2e8f0;margin-top:20px;}

  /* ============================================================
     视觉重构 · 第一档 + 第二档：点歌页的三个按钮
     实机反馈（用户红笔圈的）：「靠太近了」+「主次不分」。

     为什么用属性选择器而不是加 class：
       这三个按钮的标记被前端约束测试逐字钉着（用户逐条批准过的改动），
       不改标记就能同时满足"间距/层级"与"结构别乱动"。
     为什么是 24px：走间距节奏 --s5 一档；原来靠全局 button 的
       margin-bottom:12px 堆出来，三件不同性质的事挤成一组。
     ============================================================ */
  .box>button[onclick="searchSongs()"],
  .box>button[onclick="vote()"],
  .box>button[onclick="auditionInput()"]{
    margin:0 0 var(--s5);padding:13px 16px;font-size:15px;border-radius:var(--r-md);
  }
  /* 搜索与试听 = 次要（浅底描边），提交点歌 = 主要（实心蓝、几乎无阴影） */
  .box>button[onclick="searchSongs()"],
  .box>button[onclick="auditionInput()"]{
    background:#fff;color:#0c4a6e;border:1px solid var(--brand-line);font-weight:600;box-shadow:none;
  }
  .box>button[onclick="searchSongs()"]:hover,
  .box>button[onclick="auditionInput()"]:hover{background:var(--brand-soft);}
  .box>button[onclick="vote()"]{
    background:var(--brand);border:1px solid var(--brand);font-weight:700;box-shadow:none;letter-spacing:.5px;
  }
  .box>button[onclick="vote()"]:hover{background:var(--brand-strong);}
  /* 候选面板与搜索框之间留出一档，不再紧贴按钮 */
  #searchBox,#auditionBox{margin-bottom:var(--s2);}
  /* 两个"返回/退出"是次要操作：描边、不与主操作抢注意力 */
  .back{background:#fff;color:var(--ink-3);border:1px solid var(--line);font-weight:600;box-shadow:none;margin-top:var(--s3);padding:12px 16px;font-size:15px;}
  .back:hover{background:var(--surface-2);color:var(--ink-2);}

  /* ---------- 第四档：字体 / 间距 / 圆角统一 + 无障碍 ---------- */
  .field-label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 6px;}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{
    outline:3px solid rgba(2,132,199,0.42);outline-offset:2px;border-radius:var(--r-sm);}
  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }

  /* ==== 设计层 · 起点（由 _harness/apply-design.mjs 生成，勿手改） ==== */
/* ---------- 游客模式：提交按钮的禁用态 ----------
     禁用不只靠颜色：disabled 之后浏览器不再派发点击（脚本里的 vote()
     也做了自检），pointer-events:none 再把鼠标与触控一起挡住。
     选择器带 .box> 是为了与上面「提交点歌 = 实心品牌蓝」那条同权重、
     靠"排在后面"取胜 —— 不靠 !important，也就不影响其它按钮。 */
  .box>button[disabled]{pointer-events:none;cursor:not-allowed;background:var(--line-soft);color:var(--ink-4);border:1px solid var(--line);box-shadow:none;}
/* ============================================================
     视觉系统 v3
     ------------------------------------------------------------
     这一版是一次**整体重写**，不再是"在原版上叠补丁"。目标是把界面的
     排版、配色、密度统一到一套自洽的尺度上，解决四个具体问题：

       1. 字号千篇一律 → 建立五档排版尺度（--fs-display 30px 到 --fs-cap 12px），
          标题与正文拉开 2 倍以上差距，扫一眼就知道哪是标题、哪是正文。
       2. 有些字看不清 → 正文 15px / 1.65，辅助文字 13px 且颜色提到
          --ink-3（对白底约 7:1），不再用 #94a3b8 那种发虚的灰。
       3. 红色很突兀   → 红色只留给"真的危险"（删除 / 拒绝 / 报错）。
          票数、举报、公告都不再用红：票数是中性数据（墨黑数字 + 浅底），
          举报是安静层，公告用品牌色。
       4. 观感平庸     → 收敛色相（一套中性灰 + 一支品牌蓝 + 一支暖琥珀），
          加大留白节奏，卡片按 iOS 分组列表处理：hairline 分隔、几乎无投影。

     双端适配：
       · 手机：触控目标 ≥44px、正文 15px、列表行两行结构（信息在上、操作在下）；
       · 宽屏：对比更强、行高更紧、容器 1120px、分组之间用间距而不是分隔线。
     ============================================================ */

  /* ------------------------------------------------------------
     一、令牌：少色相、明确层级
     ------------------------------------------------------------ */
  :root{
    /* 中性层：一整套来自同一色族的灰，避免"蓝灰混用"的脏感 */
    --canvas:#f2f4f7;--surface:#ffffff;--surface-2:#f7f8fa;--surface-3:#eef0f4;--surface-4:#e7eaef;
    --ink:#111827;--ink-2:#3f4756;--ink-3:#5b6472;--ink-4:#8a93a1;
    --line:#e3e7ee;--line-soft:#eef1f5;--line-strong:#ccd2dc;
    /* 品牌：一支冷静的蓝，只出现在"该被点的地方" */
    --brand:#2563eb;--brand-strong:#1d4ed8;--brand-soft:#eef4ff;--brand-line:#c7d9fe;
    --brand-ink:#1e40af;
    /* 危险：只在删除/拒绝/错误出现 */
    --danger:#c0392b;--danger-soft:#fdf2f0;
    /* 提示：暖琥珀（"未通过/注意"用它，比红色不刺眼） */
    --warn:#a16207;--warn-soft:#fef8ec;
    --success:#0f7b53;--ok-soft:#eefaf4;

    /* 排版尺度：五档，跨度 12 → 30 */
    --fs-display:30px;--fs-title:21px;--fs-head:17px;--fs-body:15px;--fs-sub:13px;--fs-cap:12px;
    /* 行高：标题紧、正文松 */
    --lh-tight:1.25;--lh-body:1.65;
    /* 字重：Windows 上 700 的小字会糊，所以正文权重压到 400/500，标题才用 650/700 */
    --fw-body:400;--fw-medium:520;--fw-strong:650;--fw-bold:720;

    /* 间距节奏（8 的倍数为主） */
    --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:44px;
    /* 圆角：控件 12、卡片 18、大容器 22、胶囊 999 */
    --r-sm:10px;--r-md:12px;--r-lg:18px;--r-xl:22px;--r-pill:999px;
    --r-ctl:12px;--r-card:18px;

    /* 动效：一条曲线、三档时长 */
    --ease:cubic-bezier(.2,.8,.2,1);
    --ease-out:cubic-bezier(.16,1,.3,1);
    --d1:140ms;--d2:240ms;--d3:400ms;

    /* 投影：几乎不用（靠 hairline 分层），只有浮层才浮起来 */
    --shadow-card:0 1px 2px rgba(17,24,39,.04);
    --shadow-pop:0 20px 48px -20px rgba(17,24,39,.32);
    --ring:0 0 0 4px rgba(37,99,235,.14);
  }

  /* ------------------------------------------------------------
     二、画布：一处极淡的品牌渐晕 + 线性基色（测试要求保留这三样）
     ------------------------------------------------------------ */
  body{
    font-family:'Segoe UI Variable Display','Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,
      BlinkMacSystemFont,'MiSans','HarmonyOS Sans SC','PingFang SC','Hiragino Sans GB',
      'Source Han Sans SC','Noto Sans SC','Microsoft YaHei UI','Microsoft YaHei',sans-serif;
    font-size:var(--fs-body);
    line-height:var(--lh-body);
    letter-spacing:.01em;
    color:var(--ink-2);
    background-color:var(--canvas);
    background-image:
      radial-gradient(900px 420px at 50% -220px,rgba(37,99,235,.10),rgba(37,99,235,0) 68%),
      linear-gradient(180deg,#f7f9fc 0%,var(--canvas) 58%,#eaedf2 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    font-kerning:normal;
    text-rendering:optimizeLegibility;
  }

  /* ------------------------------------------------------------
     三、排版层级：五档尺度落到具体元素上
     ------------------------------------------------------------ */
  h1,h2,h3{color:var(--ink);letter-spacing:-.01em;line-height:var(--lh-tight);font-weight:var(--fw-strong);}
  /* 页面主标题：唯一一处 30px */
  .header h1,.top-bar h2{font-size:var(--fs-display);font-weight:var(--fw-bold);letter-spacing:-.022em;}
  /* 卡片标题 / 栏目标题：21px */
  .col-title,.panel h3,#rulesBox h3{font-size:var(--fs-title);font-weight:var(--fw-strong);letter-spacing:-.014em;}
  /* 正文里的标题：17px */
  .song-main h3,.card h3,.rank-info h3,.ui-title{font-size:var(--fs-head);font-weight:var(--fw-strong);}
  /* 正文与辅助：15 / 13，颜色都提到可读灰阶 */
  .song-main p,.rank-info p,.card p,.slot,.ui-msg{font-size:var(--fs-body);color:var(--ink-3);line-height:var(--lh-body);}
  .header p,.sub,.col-title span,.card h3 .range,.slot .idx,.slot .meta,
  .field-label,.ui-msg,.siteVersion,#siteVersion{font-size:var(--fs-sub);}
  /* 页脚与免责声明：最小 12px，颜色 --ink-4（不是发虚的浅灰） */
  footer p,#disclaimerBox p{font-size:var(--fs-cap);color:var(--ink-4);line-height:1.7;}
  /* 数字一律等宽：票数、排名、时长、日期对齐不跳 */
  .rank-votes,.song-votes,.slot .idx,.slot .tag,.card h3 .range,#siteVersion{font-variant-numeric:tabular-nums;}
  .rank-votes{font-size:18px;font-weight:var(--fw-strong);letter-spacing:-.01em;}
  /* 表单标签：小一号、半粗、带字距 */
  .field-label{font-weight:var(--fw-medium);color:var(--ink-2);letter-spacing:.02em;}
  /* 输入框 16px：小于 16px 会触发 iOS 聚焦自动放大 */
  input,select,textarea{font-size:16px;letter-spacing:0;color:var(--ink);}

  /* ------------------------------------------------------------
     四、卡片与分组：iOS 分组列表观感（hairline 分层，几乎不用投影）
     ------------------------------------------------------------ */
  .header,.card,.box,.panel,.list-panel,#gate,.login-box{
    background:var(--surface);
    border:1px solid var(--line);
    box-shadow:var(--shadow-card);
    border-radius:var(--r-card);
  }
  .header,.login-box,#gate{border-radius:var(--r-xl);}
  .header,.card,.box,.panel,.list-panel,#gate,.login-box,.tabs button,
  .mobile-tabs,.mobile-tabs button{backdrop-filter:none;-webkit-backdrop-filter:none;}
  /* 分组之间用间距，不用分隔线；组内用 hairline */
  .header{margin-bottom:var(--s5);}

  /* 列表行：唯一的白底圆角容器 + 行之间 hairline */
  .list-panel{margin-bottom:var(--s4);overflow:hidden;}
  .list-panel>.rank-card+.rank-card{border-top:1px solid var(--line-soft);}
  .list-panel>.rank-top{transition:background-color var(--d1) var(--ease);}
  .list-panel>.rank-card:hover>.rank-top{background:var(--surface-2);}
  /* 空榜：**不要**留一个巨大的空白盒子。
     宽屏下两栏并排时，空的"正式榜"曾经是一块 450px 高的白板，看着像加载失败。
     列表为空时里面只有一个 .sub 段落，这里把它做成"矮而安静"的提示卡。 */
  .list-panel{min-height:180px;}
  .list-panel:has(>.sub:only-child){
    min-height:0;display:flex;align-items:center;justify-content:center;
    padding:var(--s6) var(--s4);background:var(--surface-2);border-style:dashed;
  }
  .list-panel>.sub:only-child{margin:0;color:var(--ink-4);}
  @supports not (selector(:has(*))){
    /* 老浏览器（不支持 :has）退化成"列表为空时不撑高"，效果略差但不会出错 */
    .list-panel{min-height:0;}
  }

  /* ------------------------------------------------------------
     五、票数：从"降价标签"改成中性数据
     ------------------------------------------------------------ */
  .song-votes{
    flex:0 0 auto;display:inline-flex;align-items:baseline;gap:3px;
    padding:3px 10px;border-radius:var(--r-pill);
    background:var(--surface-3);border:1px solid var(--line);
  }
  .song-votes .rank-votes{color:var(--ink);}
  /* 单位"票"用辅助色；数字用墨黑 —— 靠字重与底色分层，不用红色 */
  .song-votes>span{color:var(--ink-4) !important;}

  /* ------------------------------------------------------------
     六、按钮：三层级 + 统一尺寸（大 48 / 标准 40 / 小 36，手机行内 44）
     ------------------------------------------------------------ */
  button,.gate-enter{
    letter-spacing:.02em;font-weight:var(--fw-medium);
    display:inline-flex;align-items:center;justify-content:center;gap:6px;line-height:1.2;
  }
  .btn{display:flex;align-items:center;justify-content:center;font-weight:var(--fw-strong);line-height:1.25;letter-spacing:.02em;}
  .btn,.gate-enter,.box>button,.ui-btn{
    min-height:48px;font-size:16px;padding:12px 18px;border-radius:var(--r-lg);
  }
  .song-acts button,.tabs button,.mobile-tabs button,.back,.more,
  .card .actions button,.top-bar button{
    min-height:40px;font-size:var(--fs-body);padding:9px 14px;border-radius:var(--r-ctl);
  }
  .card .actions .btn-quiet,.card .actions .btn-danger,.btn-sm,.btn-xs{
    min-height:36px;font-size:var(--fs-sub);padding:7px 12px;
  }
  @media(max-width:560px){.song-acts button,.card .actions button{min-height:44px;}}

  /* 三层级的观感：主要=实心品牌；次要=白底细描边；安静=无底；危险=红字描边 */
  .btn,.box>button[onclick="vote()"],.gate-enter,.btn-primary{background:var(--brand);color:#fff;border:1px solid var(--brand);}
  .btn:hover,.box>button[onclick="vote()"]:hover,.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong);}
  .btn-secondary,.back,.song-acts .act-secondary,
  .box>button[onclick="searchSongs()"],.box>button[onclick="auditionInput()"]{
    background:var(--surface);color:var(--ink-2);border:1px solid var(--line-strong);
  }
  .btn-secondary:hover,.back:hover,.song-acts .act-secondary:hover{background:var(--surface-2);}
  .song-acts .act-quiet,.btn-quiet{background:transparent;color:var(--ink-3);border:1px solid var(--line);}
  .song-acts .act-quiet:hover,.btn-quiet:hover{background:var(--surface-2);color:var(--ink-2);}
  .song-acts .act-primary{background:var(--brand);color:#fff;border:1px solid var(--brand);}
  .btn-danger{background:var(--surface);color:var(--danger);border:1px solid #eccfc9;}
  .btn-pass{background:var(--success);border-color:var(--success);}
  .btn-reject{background:var(--danger);border-color:var(--danger);}
  /* 按下：轻微收缩（iOS 手感），不做位移 */
  button:active,.btn:active,.song-acts button:active,.tabs button:active,.mobile-tabs button:active{
    transform:scale(.975);
  }
  button,.btn,.song-acts button,.tabs button,.mobile-tabs button,.back,.more{
    transition:background-color var(--d1) var(--ease),border-color var(--d1) var(--ease),
               color var(--d1) var(--ease),transform var(--d2) var(--ease),box-shadow var(--d1) var(--ease);
  }

  /* ------------------------------------------------------------
     七、输入控件：浅底 + 大圆角 + 焦点环
     ------------------------------------------------------------ */
  input,select,textarea{
    background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-ctl);
    transition:background-color var(--d2) var(--ease),border-color var(--d2) var(--ease),box-shadow var(--d2) var(--ease);
  }
  input::placeholder,textarea::placeholder{color:var(--ink-4);opacity:1;}
  input:focus,select:focus,textarea:focus{background:var(--surface);border-color:var(--brand);box-shadow:var(--ring);outline:none;}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,audio:focus-visible{
    outline:3px solid rgba(37,99,235,.45);outline-offset:2px;border-radius:var(--r-sm);}

  /* ------------------------------------------------------------
     八、页签与分段控件
     ------------------------------------------------------------ */
  .tabs{gap:var(--s2);}
  .tabs button{background:transparent;color:var(--ink-3);border:1px solid transparent;font-weight:var(--fw-medium);}
  .tabs button:hover:not(.active){background:var(--surface-3);color:var(--ink);}
  .tabs button.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:var(--fw-strong);}
  .mobile-tabs{
    display:flex;gap:4px;padding:3px;border-radius:var(--r-ctl);
    background:var(--surface-3);border:1px solid var(--line);
  }
  .mobile-tabs button{
    flex:1 1 0;min-height:38px;margin:0;border:0;border-radius:9px;background:transparent;
    color:var(--ink-3);font-size:var(--fs-body);font-weight:var(--fw-medium);
    transition:background-color var(--d2) var(--ease),color var(--d2) var(--ease),box-shadow var(--d2) var(--ease);
  }
  .mobile-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(17,24,39,.10);}

  /* ------------------------------------------------------------
     九、栏目标题：细竖条 + 说明文字
     ------------------------------------------------------------ */
  .col-title{border-left-width:3px;border-left-color:var(--brand);padding-left:var(--s3);margin-bottom:var(--s3);}
  .col-title span{font-weight:var(--fw-body);color:var(--ink-4);}

  /* ------------------------------------------------------------
     十、公告 / 须知 / 页脚
     ------------------------------------------------------------ */
  #announceBox .panel{
    background:var(--brand-soft);border:1px solid var(--brand-line);
    border-left:3px solid var(--brand);border-radius:var(--r-card);
  }
  #announceBox .panel h3{color:var(--brand-ink);}
  #rulesBox .panel>div:first-child{border-bottom:1px solid var(--line);}
  #rulesBox .rules-toggle{background:transparent;border:0;color:var(--brand);font-size:var(--fs-sub);font-weight:var(--fw-medium);}
  footer img{box-shadow:none;background:transparent;opacity:.4;}
  #siteVersion{color:var(--ink-4);}
  /* 空态不再占位（票页那个"大空洞"的真身就是等文案的状态行） */
  p#msg:empty,.msg:empty,.err:empty{min-height:0;margin:0;padding:0;height:0;overflow:hidden;}

  .more[style*="display:none"],.more[style*="display: none"]{display:none !important;margin:0;padding:0;height:0;}

  /* ------------------------------------------------------------
     十之二、试听面板：在列表里也要像一个"播放器"
     ------------------------------------------------------------
     试听面板是 JS 在每张卡片**后面**插的动态元素（形如 div#audition-N），
     它没有类名，所以只能靠"列表容器里的直接子 div"来定位。
     为什么要专门给它一条规则：列表行是 flex/column 结构，
     动态插入的播放器如果是行内元素，会被压成很窄的一条 —— 看着像"坏了"。
     ------------------------------------------------------------ */
  .list-panel>div:not(.rank-card){

  @keyframes riseIn3{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  .card{animation:riseIn3 var(--d3) var(--ease-out) both;}
  #listBox>.card:nth-child(2){animation-delay:30ms;}

  #listBox>.card:nth-child(5){animation-delay:120ms;}
  #listBox>.card:nth-child(6){animation-delay:150ms;}
  #listBox>.card:nth-child(7){animation-delay:180ms;}
  #listBox>.card:nth-child(n+8){animation-delay:210ms;}

     十二、宽屏：更强的对比、更紧的行高、更宽的容器
     ------------------------------------------------------------ */
  @media(min-width:900px){

    .mobile-tabs{display:none;}

    .tabs{background:transparent;border:0;padding:0;}

  /* ------------------------------------------------------------

  @media(prefers-color-scheme:dark){

      --canvas:#0f1216;--surface:#171b21;--surface-2:#1d222a;--surface-3:#242a33;--surface-4:#2b323c;

    .header,.card,.box,.panel,.list-panel,#gate,.login-box{box-shadow:var(--shadow-card);}
    /* 原版与旧层里写死的浅色文字逐条翻转（只换令牌覆盖不到它们） */

    .song-main p,.rank-info p,.rank-card p,.card p{color:var(--ink-3);}

    #announceBox .panel{background:var(--brand-soft);border-color:var(--brand-line);}
    /* 内联写死的浅底面板 */

<script>
/* 备案号与版权主体若在环境变量里配了（ICP_BEIAN / GONGAN_BEIAN / COPYRIGHT_HOLDER），
   就用它覆盖页面里写死的这组 —— 改内容不必改代码、也不用重新部署。 */
(async function applyBeian(){
  const year = document.getElementById('beianYear');
  if(year) year.textContent = new Date().getFullYear();

  try {
    const r = await fetch('/api/config');
    if(!r.ok) return;
    const b = (await r.json()).beian;
    if(!b) return;

    const holder = document.getElementById('beianHolder');
    if(holder && b.holder) holder.textContent = b.holder;

    const icp = document.getElementById('beianIcp');
    if(icp && b.icp){
      icp.textContent = b.icp;
      icp.href = 'https://beian.miit.gov.cn/';
    }

    const gongan = document.getElementById('beianGongan');
    const gonganText = document.getElementById('beianGonganText');
    if(gongan && b.gongan && gonganText){
      gonganText.textContent = b.gongan;
      // 公安备案查询页要求的 code 就是备案号里的数字部分
      const code = String(b.gongan).replace(/[^0-9]/g, '');
      gongan.href = 'https://beian.mps.gov.cn/#/query/webSearch?code=' + encodeURIComponent(code);
    }
  } catch(e) { /* 取不到就用页面里写死的值 */ }
})();
</script>

/** 对话框：resolve(true/false)；带输入框时 resolve(字符串/null)。 */
function uiDialog(opt){
  uiStyles();
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.className = 'ui-overlay';

    const box = document.createElement('div');
    box.className = 'ui-box';

    const title = document.createElement('h3');
    title.className = 'ui-title';
    title.textContent = opt.title || '提示';
    box.appendChild(title);

    if(opt.message){
      const p = document.createElement('p');
      p.className = 'ui-msg';
      p.textContent = opt.message;
      box.appendChild(p);
    }

    let input = null;
    if(opt.input){
      input = document.createElement('input');
      input.className = 'ui-input';
      input.type = opt.inputType || 'text';
      input.value = opt.inputValue || '';
      input.placeholder = opt.inputPlaceholder || '';
      box.appendChild(input);
    }

    const actions = document.createElement('div');
    actions.className = 'ui-actions';

    let settled = false;
    const close = (result) => {
      if(settled) return;
      settled = true;
      document.removeEventListener('keydown', onKey);
      overlay.classList.add('ui-closing');
      setTimeout(() => overlay.remove(), 150);
      resolve(result);
    };
    const cancelResult = () => (opt.input ? null : false);

    if(opt.cancelText !== ''){
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'ui-btn ui-btn-ghost';
      cancel.textContent = opt.cancelText || '取消';
      cancel.onclick = () => close(cancelResult());
      actions.appendChild(cancel);
    }

    const ok = document.createElement('button');
    ok.type = 'button';
    ok.className = 'ui-btn ' + (opt.danger ? 'ui-btn-danger' : 'ui-btn-primary');
    ok.textContent = opt.okText || '确定';
    ok.onclick = () => close(opt.input ? input.value : true);
    actions.appendChild(ok);

    box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function onKey(e){
      if(e.key === 'Escape'){ e.preventDefault(); close(cancelResult()); }
      else if(e.key === 'Enter'){
        // 有输入框时只在输入框里回车才提交，避免误触
        if(opt.input && document.activeElement !== input) return;
        e.preventDefault();
        close(opt.input ? input.value : true);
      }
    }
    document.addEventListener('keydown', onKey);

    overlay.addEventListener('mousedown', (e) => {
      if(e.target === overlay) close(cancelResult());
    });

    setTimeout(() => { (input || ok).focus(); }, 40);
  });
}

function uiAlert(message, title){
  return uiDialog({ title: title || '提示', message: message, okText: '知道了', cancelText: '' });
}
function uiConfirm(message, title, opts){
  return uiDialog(Object.assign(
    { title: title || '请确认', message: message, okText: '确定', cancelText: '取消' },
    opts || {}
  ));
}
function uiPrompt(message, value, title, placeholder){
  return uiDialog({
    title: title || '请输入', message: message, input: true,
    inputValue: value || '', inputPlaceholder: placeholder || '',
    okText: '确定', cancelText: '取消',
  });
}

/** 右下角轻提示，不打断操作。 */
function uiToast(message, kind){
  uiStyles();
  const t = document.createElement('div');
  t.className = 'ui-toast' + (kind === 'ok' ? ' ui-toast-ok' : kind === 'err' ? ' ui-toast-err' : '');
  t.textContent = message;
  document.body.appendChild(t);
  setTimeout(() => {
    t.classList.add('ui-hide');
    setTimeout(() => t.remove(), 320);
  }, 2400);
}

/* ============================================================
   人机校验（Google reCAPTCHA v3）
   —— 站点密钥与域名都由后端 /api/config 下发，前端不写死任何密钥。
   —— 脚本加载失败（例如网络到不了 Google）时返回空串，
      由后端按策略处理，避免"校验挂了全校都投不了稿"。
   ============================================================ */

let recaptchaConfig = null;

async function getRecaptchaConfig(){
  if(recaptchaConfig) return recaptchaConfig;
  try {
    const r = await fetch('/api/config');
    const d = r.ok ? await r.json() : {};
    recaptchaConfig = (d && d.recaptcha) || { enabled: false };
  } catch(e) {
    recaptchaConfig = { enabled: false };
  }
  return recaptchaConfig;
}

/** 取一个 reCAPTCHA v3 token；拿不到就返回空串。 */
async function recaptchaToken(action){
  const cfg = await getRecaptchaConfig();
  if(!cfg.enabled || !cfg.siteKey) return '';

  const base = (cfg.base || 'https://www.recaptcha.net').replace(/\/+$/, '');

  try {
    if(!window.grecaptcha){
      await new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = base + '/recaptcha/api.js?render=' + encodeURIComponent(cfg.siteKey);
        s.async = true;
        s.defer = true;
        s.onload = resolve;
        s.onerror = () => reject(new Error('recaptcha script blocked'));
        document.head.appendChild(s);
        // 被墙时 onerror 可能不触发，兜一个超时
        setTimeout(() => reject(new Error('recaptcha timeout')), 6000);
      });
    }
    await new Promise((resolve) => window.grecaptcha.ready(resolve));
    return await window.grecaptcha.execute(cfg.siteKey, { action: action || 'submit' });
  } catch(e) {
    // 拿不到 token：交给后端决定放行还是拒绝
    return '';
  }
}


// 设备指纹：用于"每人每周一次"的去重，替代旧版可被"换个 User-Agent"绕过的方案。
// 刻意不使用 localStorage / Cookie，这样清缓存不会把限制重置；
// 采集的是设备与浏览器本身的稳定特征（屏幕、时区、CPU 核数、Canvas / WebGL 差异）。
async function deviceFingerprint(){
  const nav = navigator, scr = window.screen || {};
  let canvasSig = 'no-canvas';
  try {
    const c = document.createElement('canvas');
    c.width = 220; c.height = 44;
    const ctx = c.getContext('2d');
    if(ctx){
      ctx.textBaseline = 'top'; ctx.font = '14px "Arial"';
      ctx.fillStyle = '#f60'; ctx.fillRect(0, 0, 110, 22);
      ctx.fillStyle = '#069'; ctx.fillText('盐中之声 yczx', 2, 3);
      ctx.strokeStyle = 'rgba(102,204,0,.7)';
      ctx.beginPath(); ctx.arc(58, 22, 15, 0, Math.PI * 2); ctx.stroke();
      canvasSig = c.toDataURL();
    }
  } catch(e) {}
  let glSig = 'no-webgl';
  try {
    const c2 = document.createElement('canvas');
    const gl = c2.getContext('webgl') || c2.getContext('experimental-webgl');
    if(gl){
      const info = gl.getExtension('WEBGL_debug_renderer_info');
      glSig = String(info ? gl.getParameter(info.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER));
    }
  } catch(e) {}
  let tz = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e) {}
  const raw = [nav.userAgent || '', nav.platform || '', nav.language || '', (nav.languages || []).join(','),
    nav.hardwareConcurrency || '', nav.maxTouchPoints || '',
    (scr.width || 0) + 'x' + (scr.height || 0) + 'x' + (scr.colorDepth || 0),
    window.devicePixelRatio || 0, tz, canvasSig, glSig].join('|');
  // 优先用 WebCrypto；http 等非安全上下文没有 crypto.subtle 时降级为确定性哈希。
  if(window.crypto && window.crypto.subtle){
    try {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    } catch(e) {}
  }
  let out = '';
  for(let seed = 0; seed < 4; seed++){
    let h = (0x811c9dc5 ^ (seed * 0x9e3779b1)) >>> 0;
    for(let i = 0; i < raw.length; i++){ h ^= raw.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    out += h.toString(16).padStart(8, '0');
  }
  return out;
}

/* ---------------- 游客模式（只读身份） ----------------
   身份来自 GET /api/me（服务端会话），**不做"试一次投稿看是否 403"的探测**：
   那会平白发一次注定失败的写请求，用户还得先填完表单才知道不行。
   注意：前端这套只是体验层，真正拦住游客的是 /api/vote 里的 denyGuest()，
   任何人都能绕过页面直接 POST。
*/
let isGuestMode = false;

/** 游客：禁掉提交并说明原因；搜索与试听**保持可用**（它们只是只读地听歌）。 */
function blockGuestSubmit(){
  isGuestMode = true;

  const btn = document.getElementById('submitVoteBtn');
  if(btn){
    btn.disabled = true;
    btn.setAttribute('aria-disabled', 'true');
    btn.title = '游客模式只能查看排行，不能投稿';
  }

  const msg = document.getElementById('msg');
  if(msg){
    msg.style.color = '#075985';
    msg.textContent = '当前为游客模式：只能查看排行，不能投稿（试听仍然可用）。请点下方「返回主页」查看排行。';
  }
}

/** 普通学生 / 调试身份：解开提交按钮。 */
function enableSubmit(){
  isGuestMode = false;

  const btn = document.getElementById('submitVoteBtn');
  if(btn){
    btn.disabled = false;
    btn.removeAttribute('aria-disabled');
    btn.removeAttribute('title');
  }
}

async function vote(){
  // 游客自检放在**最前面**（读表单之前）：游客根本不该走进后面的校验分支 ——
  // 否则他会看到"还只是搜索关键词"这类与身份无关的提示，反而更困惑。
  // 按钮已经是 disabled，但脚本 / 键盘 / 旧版缓存页面仍可能调到这个函数，
  // 所以这里再拦一次并给同样一句人话（服务端还会 403 兜底）。
  if(isGuestMode){
    const guestMsg = document.getElementById('msg');
    if(guestMsg){
      guestMsg.style.color = '#075985';
      guestMsg.textContent = '当前为游客模式：只能查看排行，不能投稿。请点下方「返回主页」查看排行。';
    }
    return;
  }

  const title = document.getElementById('title').value.trim();
  const artist = document.getElementById('artist').value.trim();
  const category = document.getElementById('category').value;
  const trackId = document.getElementById('trackId').value.trim();
  // A7：选曲凭据与音源 id 是同时写入的一对，缺了任何一个都说明"没真的选过一首"。
  const trackToken = document.getElementById('trackToken').value.trim();
  const msg = document.getElementById('msg');

  // 必须从搜索结果里选一首，把音源 id 一起提交 ——
  // 这样这首歌上榜后，任何人点「试听」直接播当初选的那一版。
  if(!trackId){
    // 区分两种情况，别再说"请先输入歌名"（框里明明有字，用户会困惑）：
    //   框里有字 → 那是搜索关键词，还没选歌
    //   框里没字 → 真的什么都没输入
    msg.style.color = '#e11d48';
    msg.textContent = title
      ? '「' + title + '」还只是搜索关键词，请在搜索结果里点一下「选这首」'
      : '请在上面输入歌名或歌手，搜索后从结果里选一首';
    return;
  }

  if(!title || !artist){
    msg.style.color = '#e11d48';
    msg.textContent = '选中的歌曲信息不完整，请重新搜索并选一首';
    return;
  }

  // 凭据缺失也要在前端就拦下并说清楚，别让用户提交完才看到服务端报错。
  // （服务端同样强制要求凭据，这里只是提前一步给人话。）
  if(!trackToken){
    msg.style.color = '#e11d48';
    msg.textContent = '选曲凭据缺失（可能是页面停留太久或列表是旧版）。请重新点「搜索歌曲」并选一首再提交';
    return;
  }

  // 选完之后又手动改了框里的字：此时 trackId 还指向原来那首，
  // 直接提交会出现"显示的是一首、实际锁定的音源是另一首"。
  const picked = document.getElementById('picked').textContent || '';
  if(picked && !picked.includes(title)){
    msg.style.color = '#e11d48';
    msg.textContent = '你改动了歌名，请重新搜索并点「选这首」确认一次，避免锁定到错误的音源';
    return;
  }

  if(!await uiConfirm('确认提交这首歌吗？\n歌名：' + title + '\n歌手：' + artist)) return;

  msg.style.color = '#0284c7'; msg.textContent = '提交中...';
  try {
    // 不再传 password / class_id：登录态由 HttpOnly 会话 Cookie 自动携带，
    // 班级身份由服务端决定，客户端无从伪造。
    const fingerprint = await deviceFingerprint();
    // 人机校验令牌（reCAPTCHA v3，无感）。没启用时是空串。
    const rcToken = await recaptchaToken('vote');
    const r = await fetch('/api/vote', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        title,
        artist,
        category_id: category,
        fingerprint,
        track_id: trackId,
        // A7：带上服务端签发的选曲凭据。带凭据时后端**以凭据里的内容为准**，
        // 上面那三个字段只是老版接口的兼容字段（也方便出问题时对照排查）。
        track_token: trackToken,
        recaptcha_token: rcToken,
      })
    });
    const d = await r.json();
    if(r.ok){
      // 调试模式会返回专门的提示文案
      const okText = d.message || '点歌成功！等待管理员审核';
      msg.style.color = '#059669';
      msg.textContent = okText;
      clearPicked();

      /*
       * 广播站反馈：原来只在行内写一行绿字，**太不明显**，容易以为没提交成功。
       * 改成明确的弹窗，确认后回主页 —— 一眼看到结果，也顺势结束这次操作。
       * 弹窗失败（例如被浏览器拦下）也必须回主页，不能卡在投稿页。
       */
      try {
        await uiAlert(okText + '\n\n管理员审核通过后会安排播出。', '投稿成功');
      } catch(e) { /* 弹窗出问题也要继续 */ }
      location.href = '/';
      return;
    } else if(r.status === 401){
      /*
       * 会话过期：**提示清楚，并等用户按下按钮再回登录页**。
       * 旧写法只在行内写一行红字、1.2 秒后自动跳 —— 用户既没有可点的东西，
       * 也来不及看清，感觉像"页面自己跑了"。现在改成明确的弹窗，
       * 按下「去登录」才跳；弹窗本身出问题也照样跳，不把人卡在投稿页。
       */
      msg.style.color = '#e11d48';
      msg.textContent = '登录已过期，请重新输入班级口令。';
      try {
        await uiAlert('登录已过期（学生会话有效期 1 天）。\n\n点「去登录」重新输入班级口令即可继续。', '需要重新登录');
      } catch(e) { /* 弹窗出问题也要继续 */ }
      location.href = '/';
      return;
    } else {
      msg.style.color = '#e11d48'; msg.textContent = d.error || '出错了';
    }
  } catch(e) { msg.style.color = '#e11d48'; msg.textContent = '网络错误'; }
}

/** 清空已选中的那一首。 */
function clearPicked(){
  document.getElementById('title').value = '';
  document.getElementById('artist').value = '';
  document.getElementById('trackId').value = '';
  document.getElementById('trackToken').value = '';
  document.getElementById('picked').textContent = '';
}

// /api/logout 会把学生与管理员两种身份一起清掉，退出后要重新输入口令。

/* ---------------- 试听 ---------------- */

// 「先试听一下」：直接用歌名框里的关键词搜一遍，本质上和「搜索歌曲」同一个来源。
// 区别只是结果面板不同（这里的面板不含「选这首」也行——其实也带了）。
// 后端已做三级降级：歌名+歌手 → 只按歌名 → 模糊搜索，输入不全时也能找到。
async function auditionInput(){
  const box = document.getElementById('auditionBox');
  const keyword = document.getElementById('title').value.trim();
  const artist = document.getElementById('artist').value.trim();

  // 再点一次收起
  if(box.dataset.open === '1'){
    box.dataset.open = '0';
    box.innerHTML = '';
    return;
  }
  if(!keyword){
    box.dataset.open = '1';
    box.innerHTML = '<p class="sub" style="color:#b45309;">请在上面那个框里输入歌名或歌手（输一部分就行），再试听。</p>';
    document.getElementById('title').focus();
    return;
  }

  // 与搜索按钮同一套序号：试听也会作废上一次还没回来的搜索
  const seq = abortMusicSearch();
  box.dataset.open = '1';
  box.innerHTML = '<p class="sub">正在搜索音源…</p>';

  try {
    let url = '/api/music?q=' + encodeURIComponent(keyword);
    // 只有真的选定了某首歌时才带上歌手（此时 artist 是选中结果填的），
    // 否则它只是上次选中的残留，会把搜索范围限死。
    const hasPicked = document.getElementById('trackId').value.trim() !== '';
    if(hasPicked && artist) url += '&artist=' + encodeURIComponent(artist);
    const r = await fetch(url, { signal: musicSearchSignal() });
    const d = await r.json();
    // 已经不是最新一次 —— 丢弃这次响应（旧结果不许覆盖新结果）
    if(!__musicSearchCurrent(seq)) return;
    if(!r.ok){
      box.innerHTML = '<p class="sub" style="color:#e11d48;">' + escapeHtml(d.error || '搜索失败') + '</p>';
      return;
    }
    const list = Array.isArray(d.results) ? d.results : [];
    if(!list.length){
      box.innerHTML = '<p class="sub">没找到可试听的版本，换个写法再试试</p>';
      return;
    }
    box.innerHTML = candidatePanelHtml(
      '试听候选',
      '点「选这首」会把这首歌的歌名歌手填进上面的表单，不会自动提交',
      list, 'auditionBox', true
    );
  } catch(e) {
    if(isAbortError(e) || !__musicSearchCurrent(seq)) return;
    box.innerHTML = '<p class="sub" style="color:#e11d48;">网络错误</p>';
  }
}

/* ---------------- 模糊搜索 ---------------- */

/**
 * 搜索歌曲。
 *
 * 歌名框本身就是搜索框：在里面输入关键词（歌名或歌手的一部分都行），
 * 回车或点「搜索歌曲」就会搜。后端做了三级降级
 * （歌名+歌手 → 只按歌名 → 模糊搜索），所以输「七里」也能找到「七里香」。
 *
 * 注意：歌手框是只读的（那是"已选中"的展示位），所以搜索只用歌名框的内容。
 */
async function searchSongs(){
  const box = document.getElementById('searchBox');
  const keyword = document.getElementById('title').value.trim();

  if(!keyword){
    box.innerHTML = '<p class="sub" style="color:#b45309;">请在上面那个框里输入歌名或歌手（输一部分就行），再搜索。</p>';
    document.getElementById('title').focus();
    return;
  }

  // 作废上一次搜索（中止它在飞的请求），并登记这一次的序号
  const seq = abortMusicSearch();
  box.innerHTML = '<p class="sub">正在搜索…</p>';

  try {
    const r = await fetch('/api/music?q=' + encodeURIComponent(keyword), { signal: musicSearchSignal() });
    const d = await r.json();
    // 已经不是最新一次搜索 —— 这次响应作废，绝不写 DOM
    if(!__musicSearchCurrent(seq)) return;
    if(!r.ok){
      box.innerHTML = '<p class="sub" style="color:#e11d48;">' + escapeHtml(d.error || '搜索失败') + '</p>';
      return;
    }
    const list = Array.isArray(d.results) ? d.results : [];
    if(!list.length){
      box.innerHTML = '<p class="sub">没搜到。试试只输歌名，或者换个写法。</p>';
      return;
    }
    box.innerHTML = candidatePanelHtml(
      '搜索候选',
      '点「选这首」会填进上面的表单，不会自动提交',
      list, 'searchBox', true
    );
  } catch(e) {
    // 是我们自己中止的：不报错（用户已经发起了新的一次搜索）
    if(isAbortError(e) || !__musicSearchCurrent(seq)) return;
    box.innerHTML = '<p class="sub" style="color:#e11d48;">网络错误</p>';
  }
}

/* ---------------- 音乐搜索：取消旧请求 + 只认最新 ---------------- */

/**
 * 搜索的音源查询会有"先发后到"的问题：用户改词再搜时，
 * 第一次的响应可能比第二次晚回来，把新结果覆盖成旧结果。
 *
 * 两道防线一起用：
 *   · _musicSearchAbort —— 发起新搜索前中止上一次还在飞的请求（省一次网络往返）；
 *   · _musicSearchSeq  —— 响应回来时核对"我还是不是最新那次"，不是就整段丢弃。
 *     只靠中止不够：请求可能已经到达服务端、abort 不保证不 resolve。
 *
 * 为什么两个入口（搜索按钮 / 试听按钮）共用一套序号：
 *   它们显示在页面上的两个不同面板里，但都是"依据当前输入的一次查询"。
 *   共用之后，点试听会顺带作废上一次搜索的过期响应，反之亦然 ——
 *   否则会出现"试听面板显示的是刚才搜索的结果"这种更混乱的状态。
 */
let _musicSearchSeq = 0;
let _musicSearchAbort = null;

/** 正在进行的搜索是不是"当前这一次"。 */
function __musicSearchCurrent(seq){
  return seq === _musicSearchSeq;
}

/** 作废上一次搜索：中止它在飞的请求。 */
function abortMusicSearch(){
  if(_musicSearchAbort){
    try { _musicSearchAbort.abort(); } catch(e) { /* 已经结束了 */ }
    _musicSearchAbort = null;
  }
  _musicSearchSeq += 1;
  return _musicSearchSeq;
}

/** 给这次搜索造一个可中止的 signal；不支持 AbortController 时返回 undefined（照常发请求）。 */
function musicSearchSignal(){
  if(typeof AbortController !== 'function') return undefined;
  _musicSearchAbort = new AbortController();
  return _musicSearchAbort.signal;
}

/** 主动中止会抛 AbortError —— 那不是"网络错误"，不该弹给用户看。 */
function isAbortError(err){
  return Boolean(err) && (err.name === 'AbortError' || err.code === 20);
}

/** 秒 -> m:ss */
function formatDuration(seconds){
  const total = Number(seconds);
  if(!Number.isFinite(total) || total <= 0) return '';
  const m = Math.floor(total / 60);
  const s = Math.round(total % 60);
  return m + ':' + String(s).padStart(2, '0');
}

/**
 * 把选中的歌填进表单。
 *
 * 除了歌名歌手，还会把**音源 id 记进隐藏字段 trackId** —— 提交时一起带上，
 * 这首歌上榜后任何人点「试听」就直接播当初锁定的这一版，不会播成别的版本。
 * 用 data-* 传参，避免歌名里的特殊字符破坏 onclick。
 */
function pickSong(button){
  const name = button.dataset.name || '';
  const artist = button.dataset.artist || '';
  const track = button.dataset.track || '';
  // A7：候选自带的选曲凭据。它由搜索接口签发，里面已经绑定了
  // "这首歌名 + 这个歌手 + 这个音源 id"，提交时一并带上，
  // 服务端就以凭据内容为准 —— 客户端再没有机会把三者拆开重组。
  // 后端签名失败时它是空串（老流程），此时提交会被拦下并提示重新搜索。
  const token = button.dataset.token || '';

  // 歌名框同时也是搜索框，选中后就把完整歌名写回去 ——
  // 这样用户看到的"框里的字"始终等于"将要提交的歌"。
  document.getElementById('title').value = name;
  document.getElementById('artist').value = artist;
  document.getElementById('trackId').value = track;
  document.getElementById('trackToken').value = token;
  document.getElementById('picked').textContent =
    track ? ('已选中：' + name + ' - ' + artist + '（提交后就锁定这一版音源）') : '';

  // 另一个面板如果开着，一起收掉，避免两个列表同时占着屏幕
  for(const id of ['searchBox', 'auditionBox']){
    if(id === button.dataset.clear) continue;
    const other = document.getElementById(id);
    if(other && other.dataset.open === '1'){ closeCandidatePanel(id); }
  }

  const box = document.getElementById(button.dataset.clear || 'searchBox');
  if(!box) return;
  delete box.dataset.open;
  box.innerHTML = '<p class="sub" style="color:#059669;">已选中「' + escapeHtml(name) + '」</p>'
    + '<p class="sub" style="color:#94a3b8;">想换一首的话，直接改上面框里的关键词重新搜即可。</p>';
}

/**
 * 候选面板：**顶部一个固定播放器 + 下面一份音乐列表**。
 *
 * 早期版本把 <audio> 追加到列表末尾，点最后一首时播放条会跑到很下面。
 * 现在播放器固定在面板顶部，点任意一行都只替换它的内容并高亮该行。
 */
function candidatePanelHtml(title, hint, list, boxId, withPick){
  const rows = list.map((s, index) => `
    <div data-track-row="${escapeHtml(s.id)}"
         style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed rgba(14,165,233,0.3);flex-wrap:wrap;">
      <span style="flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:rgba(14,165,233,0.16);color:#075985;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;">${index + 1}</span>
      <div style="flex:1;min-width:0;font-size:13px;line-height:1.45;">
        <div style="color:#0f172a;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.name)}</div>
        <div style="color:#64748b;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(s.artist)}${s.album ? ' · ' + escapeHtml(s.album) : ''}${s.source ? ' · ' + escapeHtml(s.source) : ''}</div>
      </div>
      <span style="flex:0 0 auto;font-size:12px;color:#94a3b8;">${escapeHtml(formatDuration(s.duration))}</span>
      <div style="flex:0 0 auto;display:flex;gap:6px;">
        ${withPick ? `<button data-name="${escapeHtml(s.name)}" data-artist="${escapeHtml(s.artist)}" data-track="${escapeHtml(s.id)}" data-token="${escapeHtml(s.track_token || s.token || '')}" data-clear="${boxId}" onclick="pickSong(this)"
          style="width:auto;padding:7px 12px;font-size:13px;margin:0;">选这首</button>` : ''}
        <button data-track="${escapeHtml(s.id)}" data-target="${boxId}" onclick="playFromButton(this)"
          style="width:auto;padding:7px 12px;font-size:13px;margin:0;background:rgba(255,255,255,0.95);color:#64748b;border:1px solid #bae6fd;box-shadow:none;">播放</button>
      </div>
    </div>
  `).join('');

  return `
    <div style="margin:10px 0 16px;border-left:4px solid #0ea5e9;border-radius:0 12px 12px 0;background:rgba(14,165,233,0.09);">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 4px;">
        <div style="font-size:13px;font-weight:700;color:#075985;">${escapeHtml(title)} · ${list.length} 个</div>
        <button onclick="closeCandidatePanel('${boxId}')"
          style="width:auto;padding:5px 12px;font-size:12px;margin:0;background:rgba(255,255,255,0.95);color:#64748b;border:1px solid #bae6fd;box-shadow:none;">收起 ▲</button>
      </div>
      <div style="font-size:11px;color:#64748b;padding:0 12px 8px;">${escapeHtml(hint)}</div>

      <div id="player-${boxId}"
           style="margin:0 12px 10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.96);border:1px solid #bae6fd;">
        <div style="font-size:12px;color:#94a3b8;">点下面任意一行的「播放」开始试听</div>
      </div>

      <div style="padding:0 12px 10px;">${rows}</div>
    </div>
  `;
}

function closeCandidatePanel(boxId){
  const box = document.getElementById(boxId);
  if(!box) return;
  box.dataset.open = '0';
  box.innerHTML = '';
}

function playFromButton(button){
  playTrack(button.dataset.track, button.dataset.target || 'auditionBox');
}

/** 播放器固定在面板顶部，只替换它的内容，不再往列表末尾追加。 */
function playTrack(trackId, boxId){
  const box = document.getElementById(boxId);
  const slot = document.getElementById('player-' + boxId);
  if(!box || !slot || !trackId) return;

  box.querySelectorAll('[data-track-row]').forEach((row) => {
    row.style.background = row.dataset.trackRow === trackId ? 'rgba(14,165,233,0.14)' : 'transparent';
  });

  slot.innerHTML = '<div style="font-size:12px;font-weight:600;color:#075985;margin-bottom:6px;">正在试听</div>';

  const audio = document.createElement('audio');
  audio.controls = true;
  audio.preload = 'none';
  audio.src = '/api/music?play=' + encodeURIComponent(trackId);
  audio.style.width = '100%';
  slot.appendChild(audio);
  audio.play().catch(() => { /* 浏览器可能拦截自动播放，忽略 */ });
}

// 进页面先确认会话仍有效（替代旧版读取 sessionStorage 里保存的口令），
// 并顺便问清"是不是游客" —— 游客在**进来时就**知道不能投稿，
// 而不是填完表单才被服务端拒掉。
(async function(){
  let guest = false;
  try {
    const r = await fetch('/api/me');
    if(r.status === 401){ uiAlert('请先回主页输入口令登录！'); location.href = '/'; return; }
    if(r.ok){
      const me = await r.json();
      guest = !!me.isGuest;
    }
  } catch(e) {
    // 身份没取到（网络抖动）：不挡人，交给服务端的硬闸门。
    // 反过来（取不到就按游客处理）会让正常学生在弱网下连投稿都点不了，
    // 而"漏认游客"最坏也只是按钮没灰 —— 服务端照样 403。
  }

  if(guest) blockGuestSubmit();
  else enableSubmit();
})();
</script>
