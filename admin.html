<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>后台 · 盐中之声</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div class="shell">
    <div id="nav"></div>
    <main class="form-wrap" id="adminScreen">
      <section class="form-card">
        <img class="brand-mark" src="/assets/ico.svg" alt="盐中之声徽标">
        <p class="kicker">CONTROL ROOM</p>
        <h1>广播站控制台</h1>
        <p>管理员登录后管理投稿与审核状态。</p>
        <form id="adminLogin">
          <div class="field"><label for="adminName">管理员账号</label><input id="adminName" class="input" value="admin" autocomplete="username"></div>
          <div class="field"><label for="adminPassword">密码</label><input id="adminPassword" class="input" type="password" placeholder="输入管理员密码" autocomplete="current-password"></div>
          <div class="form-actions"><button class="btn primary" type="submit">登录后台</button><a class="btn" href="/register.html">注册</a></div>
          <p id="adminMessage" class="message"></p>
        </form>
      </section>
    </main>
    <main id="adminWork" hidden>
      <div class="page-head"><div><p class="kicker">OPERATIONS</p><h1>管理工作台</h1></div><span class="muted">审核、排期与站点规则</span></div>
      <div class="admin-layout">
        <nav id="adminTabs" class="panel admin-nav">
          <button class="active" data-view="pending">待审核</button>
          <button data-view="approved">已通过</button>
          <button data-view="rejected">回收站</button>
          <button data-view="reports">举报收件箱</button>
          <button data-view="suggestions">版本建议</button>
          <button data-view="announcements">公告</button>
          <button data-view="schedule">排期管理</button>
          <button data-view="banned">违禁词库</button>
          <button data-view="settings">系统设置</button>
          <button data-view="accounts">管理员账号</button>
          <button data-view="invites">邀请码</button>
        </nav>
        <section class="panel">
          <div class="panel-head"><h2 id="adminTitle">待审核歌曲</h2><button class="btn quiet" id="adminRefresh" type="button">刷新</button></div>
          <div class="admin-toolbar" id="adminToolbar"></div>
          <div id="reportInbox"></div>
          <div id="adminRows"><p class="muted">加载中…</p></div>
        </section>
      </div>
    </main>
    <dialog id="adminDialog" class="glass-dialog">
      <form method="dialog"><button class="btn quiet dialog-close" aria-label="关闭">×</button></form>
      <div id="dialogContent"></div>
    </dialog>
    <footer class="footer">管理员操作会直接影响校园广播曲库。</footer>
  </div>
  <script src="/assets/js/gsap.min.js"></script>
  <script src="/assets/js/app.js"></script>
</body>
</html>
