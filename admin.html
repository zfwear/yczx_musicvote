<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>管理员后台</title>
<style>
  body{font-family:'PingFang SC','Microsoft YaHei',system-ui,sans-serif;max-width:520px;margin:0 auto;padding:20px 16px;background:linear-gradient(135deg,#f0f4f8 0%,#e2e8f0 100%);min-height:100vh;color:#1e293b;}
  input,button{font-size:16px;padding:14px;width:100%;box-sizing:border-box;margin:0 0 12px 0;border-radius:10px;border:1px solid #e2e8f0;background:rgba(255,255,255,0.9);}
  button{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;border:0;cursor:pointer;font-weight:bold;box-shadow:0 4px 14px rgba(14,165,233,0.3);transition:transform 0.2s;}
  button:active{transform:scale(0.97);}
  .card{background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);padding:16px 20px;border-radius:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,0.9);box-shadow:0 2px 8px rgba(0,0,0,0.04);}
  .card h3{margin:0 0 6px 0;font-size:15px;color:#1e293b;}
  .card p{margin:0 0 10px 0;font-size:13px;color:#64748b;}
  .card .actions{display:flex;gap:10px;}
  .card .actions button{margin:0;padding:10px;font-size:14px;}
  .btn-pass{background:#059669;box-shadow:0 4px 14px rgba(5,150,105,0.3);}
  .btn-reject{background:#e11d48;box-shadow:0 4px 14px rgba(225,29,72,0.3);}
  .hidden{display:none;}
  .msg{text-align:center;font-size:14px;min-height:20px;color:#e11d48;}
  .tabs{display:flex;gap:10px;margin-bottom:20px;}
  .tabs button{background:#e2e8f0;color:#475569;padding:10px;font-size:14px;margin:0;box-shadow:none;border-radius:8px;}
  .tabs button.active{background:#0284c7;color:#fff;}
  .sub{color:#94a3b8;font-size:12px;text-align:center;}
  .login-box{background:rgba(255,255,255,0.8);backdrop-filter:blur(10px);padding:24px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,0.05);margin-top:40px;}
  .top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .top-bar h2{color:#0f172a;margin:0;font-size:20px;}
  .top-bar button{width:auto;padding:8px 14px;background:#64748b;font-size:13px;box-shadow:none;}
</style>
</head>
<body>
<div id="loginBox" class="login-box">
  <h2 style="text-align:center;color:#0f172a;margin-top:0;">管理员登录</h2>
  <p class="sub">请输入管理员账号、密码，如有动态口令请一并填写</p>
  <input id="username" placeholder="管理员账号" value="admin">
  <input id="password" type="password" placeholder="管理员密码">
  <input id="token" placeholder="动态口令 (选填)">
  <button onclick="adminLogin()">登录</button>
  <p id="loginMsg" class="msg"></p>
</div>

<div id="adminBox" class="hidden">
  <div class="top-bar">
    <h2>管理员后台</h2>
    <button onclick="logout()">退出</button>
  </div>
  <div class="tabs">
  <button class="active" onclick="switchTab('pending', this)">待审核</button>
  <button onclick="switchTab('approved', this)">已通过</button>
  <button onclick="switchTab('rejected', this)">回收站</button>
  <button onclick="switchTab('settings', this)">系统设置</button>
</div>
  <div id="listBox"><p class="sub">加载中...</p></div>
</div>
<script>
let currentStatus = 'pending';
function switchTab(status, btn){
  currentStatus = status;
  document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadList();
}
async function adminLogin(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const token = document.getElementById('token').value.trim();
  const msg = document.getElementById('loginMsg');
  if(!username || !password){ msg.textContent = '账号和密码都要填'; return; }
  msg.textContent = '登录中...';
  try {
    const r = await fetch('/api/admin-login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password, token})
    });
    const d = await r.json();
    if(r.ok){
      sessionStorage.setItem('admin_pw', password);
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('adminBox').classList.remove('hidden');
      loadList();
    } else { msg.textContent = d.error || '登录失败'; }
  } catch(e) { msg.textContent = '网络错误'; }
}
async function loadList(){
  const box = document.getElementById('listBox');
  if(currentStatus === 'settings') { loadSettings(); return; }
  box.innerHTML = '<p class="sub">加载中...</p>';
  try {
    const r = await fetch('/api/admin-list?status=' + currentStatus);
    const list = await r.json();
    if(!list.length){ box.innerHTML = '<p class="sub">这里空空如也</p>'; return; }
    box.innerHTML = list.map(s => `
      <div class="card">
        <h3>${s.title} - ${s.artist}</h3>
        <p>分类：${s.category_name} | 票数：${s.votes} | 班级：${s.class_id}</p>
        <div style="margin: 8px 0;">
          <select onchange="updateCategory(${s.id}, this.value)" style="padding:6px; font-size:14px; width:auto; border-radius:6px; border:1px solid #e2e8f0;">
            <option value="1" ${s.category_id == 1 ? 'selected' : ''}>纯音乐</option>
            <option value="2" ${s.category_id == 2 ? 'selected' : ''}>中文歌</option>
            <option value="3" ${s.category_id == 3 ? 'selected' : ''}>英文歌</option>
            <option value="4" ${s.category_id == 4 ? 'selected' : ''}>小语种</option>
          </select>
        </div>
        <div class="actions">
          ${currentStatus === 'pending' ? `<button class="btn-pass" onclick="action(${s.id}, 'approve')">通过</button><button class="btn-reject" onclick="action(${s.id}, 'reject')">拒绝</button>` : ''}
          ${currentStatus === 'approved' ? `<button class="btn-reject" onclick="action(${s.id}, 'reject')">移入回收站</button>` : ''}
          ${currentStatus === 'rejected' ? `<button class="btn-pass" onclick="action(${s.id}, 'restore')">恢复</button>` : ''}
        </div>
      </div>
    `).join('');
  } catch(e) { box.innerHTML = '<p class="sub" style="color:#e11d48;">加载失败</p>'; }
}
  async function loadSettings(){
  const box = document.getElementById('listBox');
  box.innerHTML = '<p class="sub">加载中...</p>';
  const r = await fetch('/api/admin-settings');
  const banneds = await r.json();
  
  let bannedHtml = '';
  if(banneds.length) {
    bannedHtml = banneds.map(b => `
      <div class="card">
        <p style="margin:0 0 6px 0;font-size:13px;">${b.type === 'artist' ? '歌手' : '歌名'}：<b>${b.keyword}</b>（${b.reason}）</p>
        <button class="btn-reject" onclick="deleteBanned(${b.id})">删除</button>
      </div>
    `).join('');
  } else {
    bannedHtml = '<p class="sub">黑名单为空</p>';
  }

  box.innerHTML = `
    <div class="card">
      <h3>修改班级口令</h3>
      <input id="newClassPw" placeholder="新班级口令" style="font-size:14px;padding:10px;margin:8px 0;">
      <button onclick="updateClassPassword()" style="font-size:14px;padding:10px;">保存新口令</button>
    </div>
    <div class="card">
      <h3>添加违禁名单</h3>
      <select id="bannedType" style="font-size:14px;padding:10px;margin:8px 0;width:100%;box-sizing:border-box;">
        <option value="artist">违禁歌手</option>
        <option value="title">违禁歌名</option>
      </select>
      <input id="bannedKeyword" placeholder="关键词（如：吴亦凡）" style="font-size:14px;padding:10px;margin:8px 0;">
      <input id="bannedReason" placeholder="原因（选填）" style="font-size:14px;padding:10px;margin:8px 0;">
      <button onclick="addBanned()" style="font-size:14px;padding:10px;">加入黑名单</button>
    </div>
    <div class="card">
      <h3>当前黑名单</h3>
      <div id="bannedList">${bannedHtml}</div>
    </div>
  `;
}
  async function updateClassPassword(){
  const newPw = document.getElementById('newClassPw').value.trim();
  if(!newPw) { alert('新口令不能为空'); return; }
  const adminPw = sessionStorage.getItem('admin_pw') || '';
  const r = await fetch('/api/admin-settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'update_class_password', new_password: newPw, password: adminPw})});
  const d = await r.json();
  if(r.ok) alert('修改成功！新口令已生效'); else alert(d.error || '修改失败');
}
async function addBanned(){
  const type = document.getElementById('bannedType').value;
  const keyword = document.getElementById('bannedKeyword').value.trim();
  const reason = document.getElementById('bannedReason').value.trim() || '违规';
  if(!keyword) { alert('关键词不能为空'); return; }
  const adminPw = sessionStorage.getItem('admin_pw') || '';
  const r = await fetch('/api/admin-settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'add_banned', type, keyword, reason, password: adminPw})});
  const d = await r.json();
  if(r.ok) { alert('添加成功'); loadSettings(); } else alert(d.error || '添加失败');
}
async function deleteBanned(id){
  const adminPw = sessionStorage.getItem('admin_pw') || '';
  const r = await fetch('/api/admin-settings', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({action:'delete_banned', id, password: adminPw})});
  if(r.ok) { alert('已删除'); loadSettings(); } else alert('删除失败');
}
async function action(id, type){
  const adminPw = sessionStorage.getItem('admin_pw') || '';
  const typeText = type === 'approve' ? '通过' : (type === 'reject' ? '拒绝' : '恢复');
  if(!confirm('确认要执行【' + typeText + '】操作吗？')) return;
  const r = await fetch('/api/admin-action', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, type, password: adminPw})
  });
  if(r.ok){ loadList(); } else { alert('操作失败'); }
}
async function updateCategory(id, catId){
  const adminPw = sessionStorage.getItem('admin_pw') || '';
  const r = await fetch('/api/admin-update', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id, category_id: catId, password: adminPw})
  });
  if(r.ok){ loadList(); } else { alert('修改失败'); }
}
function logout(){
  sessionStorage.removeItem('admin_pw');
  document.getElementById('adminBox').classList.add('hidden');
  document.getElementById('loginBox').classList.remove('hidden');
}
if(sessionStorage.getItem('admin_pw')){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('adminBox').classList.remove('hidden');
  loadList();
}
</script>
</body>
</html>
