<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>注册管理员 · 盐中之声</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><div class="shell"><main class="form-wrap"><section class="form-card"><span class="brand-mark">✦</span><p class="kicker">STAFF ACCESS</p><h1>创建管理员账号</h1><p>需要高级管理员提供动态邀请码。</p><form id="registerForm"><div class="field"><label for="registerName">登录账号</label><input id="registerName" class="input" placeholder="2–24 位"></div><div class="field"><label for="registerPassword">登录密码</label><input id="registerPassword" class="input" type="password" placeholder="至少 6 位"></div><div class="field"><label for="registerPassword2">确认密码</label><input id="registerPassword2" class="input" type="password" placeholder="再次输入"></div><div class="field"><label for="invite">动态邀请码</label><input id="invite" class="input" placeholder="ABCD-EFGH-JKLM"></div><div class="form-actions"><button class="btn primary" type="submit">创建账号</button><a class="btn" href="/admin.html">返回登录</a></div><p id="registerMessage" class="message"></p></form></section></main><footer class="footer">仅限广播站工作人员使用。</footer></div><script src="/assets/js/app.js"></script></body></html>
