    <div id="nav"></div>
    <main class="form-wrap wide">
      <div class="page-head">
        <div>
          <p class="kicker">BETTER VERSION</p>
          <h1>为歌曲提出版本建议</h1>
          <p class="muted">试听榜单中的已选版本后，告诉广播站哪一首需要更换或修正。</p>
        </div>
        <a class="btn" href="/">返回首页</a>
      </div>
      <section class="form-card">
        <form id="suggestSearch">
          <div class="field"><label for="suggestQuery">搜索榜单歌曲</label><input class="input" id="suggestQuery" placeholder="歌曲名或歌手"></div>
          <button class="btn" type="submit">搜索</button>
        </form>
        <div id="suggestResults" class="list"></div>
        <form id="suggestForm">
          <p id="suggestPicked" class="notice">请先从榜单选择歌曲</p>
          <div class="field"><label for="suggestContent">建议内容</label><textarea class="input" id="suggestContent" maxlength="120" required placeholder="例如：当前版本不是原唱，希望改为……"></textarea></div>
          <button class="btn primary" type="submit">提交建议</button>
          <p id="suggestMessage" class="message"></p>
        </form>
      </section>
    </main>
    <footer id="beianFooter" class="footer">
