<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版本建议 · 盐中之声</title><link rel="stylesheet" href="/assets/css/app.css"></head><body><div class="shell"><div id="nav"></div><main class="form-wrap wide"><section class="form-card"><p class="kicker">BETTER VERSION</p><h1>为歌曲提出版本建议</h1><p>试听榜单中的已选版本后，告诉广播站哪一首需要更换或修正。</p><form id="suggestSearch"><div class="field"><label for="suggestQuery">搜索榜单歌曲</label><input class="input" id="suggestQuery" placeholder="歌曲名或歌手"></div><button class="btn" type="submit">搜索</button></form><div id="suggestResults" class="list"></div><form id="suggestForm"><p id="suggestPicked" class="notice">请先从榜单选择歌曲</p><div class="field"><label for="suggestContent">建议内容</label><textarea class="input" id="suggestContent" maxlength="120" required placeholder="例如：当前版本不是原唱，希望改为……"></textarea></div><button class="btn primary" type="submit">提交建议</button><p id="suggestMessage" class="message"></p></form></section></main><footer class="footer">建议仅用于协助管理员改善曲库版本。</footer></div><script src="/assets/js/gsap.min.js"></script><script src="/assets/js/app.js"></script></body></html>
