  <script>/* theme-boot */(function(){try{var root=document.documentElement;var snap=null;try{snap=JSON.parse(localStorage.getItem("rl_theme_v1")||"null");}catch(e){}var site=(snap&&snap.site)||localStorage.getItem("site_theme")||"";var p=(snap&&snap.personal)||null;var path=(location.pathname||"/").replace(/\.html$/i,"").replace(/\/+$/,"")||"/";var personalPage=path==="/"||path==="/index"||path==="/vote"||path==="/schedule"||path==="/suggest"||path==="/preferences";var cachedUser="";try{var me=JSON.parse(localStorage.getItem("yczxc_v1_me")||"null");cachedUser=(me&&me.d&&me.d.personal&&me.d.personal.username)||"";}catch(e){}if(!personalPage||!p||!cachedUser||p.username!==cachedUser)p=null;if(p&&p.vars){root.removeAttribute("data-theme");for(var k in p.vars){if(Object.prototype.hasOwnProperty.call(p.vars,k)){try{root.style.setProperty(k,p.vars[k]);}catch(e){}}}root.style.colorScheme=p.scheme||"";}else if(p&&Object.prototype.hasOwnProperty.call(p,"preset")){if(p.preset)root.setAttribute("data-theme",p.preset);else root.removeAttribute("data-theme");}else if(site){root.setAttribute("data-theme",site);}}catch(e){}})();</script>

      <div class="gate">
        <img class="brand-mark" src="/assets/ico.svg" alt="盐中之声徽标">
        <p class="kicker kicker-case">YZstudent RadioLight</p>
        <h1>让下一首旋律，由你决定。</h1>
        <p>北校区广播站点歌系统，输入游客口令或「班级口令@姓名」开始探索。</p>
        <form id="gateForm">
          <div class="field">
            <label for="gatePassword">登录口令</label>
            <div class="password-field">
              <input id="gatePassword" class="input password-mask" type="text" placeholder="请输入口令" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
              <button class="password-toggle" id="toggleGatePassword" type="button" aria-label="显示口令" aria-pressed="false">
                <svg data-eye width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg data-eye-off width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-3.2 4.1"/><path d="M6.1 6.1C3.5 8 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.2 3.3-.6"/></svg>
              </button>
            </div>
            <p class="hint">游客口令可直接进入只读浏览；班级同学请输入「班级口令@姓名」正式登录（姓名需在年级名单内）。</p>
          </div>
          <div class="form-actions">
            <button class="btn primary" type="submit">进入</button>
          </div>
          <p id="gateMessage" class="message"></p>
        </form>
        <div id="gateAnnouncements" class="announcement-stack"></div>
      </div>
    </section>

    <footer id="beianFooter" class="footer">
