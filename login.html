<!doctype html>
<html lang="zh-CN">
<head>

    <section id="gateView" class="gate-wrap" hidden>
      <div class="gate">
        <img class="brand-mark" src="/assets/ico.svg" alt="盐中之声徽标">
        <p class="kicker">YANCHENG RADIO / 02</p>
        <h1>让下一首旋律，由你决定。</h1>
        <p>北校区广播站点歌系统，输入班级口令开始探索。</p>
        <form id="gateForm">
          <div class="field">
            <label for="gatePassword">班级口令</label>
            <input id="gatePassword" class="input" type="password" placeholder="请输入口令" autocomplete="current-password">
          </div>
          <div class="form-actions">
            <button class="btn primary" type="submit">进入</button>
            <button class="btn" type="button" id="guestLogin">游客浏览</button>
          </div>
          <p id="gateMessage" class="message"></p>
        </form>
        <div id="gateAnnouncements" class="announcement-stack"></div>
      </div>
    </section>

    <footer id="beianFooter" class="footer">
      <div class="beian-row">
        <a id="beianIcp" href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2026011040号</a>

      <div class="site-version">版本 3.2.0</div>

  </div>
